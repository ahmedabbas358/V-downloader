name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          echo "Setting up permanent signing configuration..."
          if [ ! -f "keystore.properties" ]; then
            cat <<EOF > keystore.properties
          keyAlias=vdownloader
          keyPassword=vdownloader_keystore_pass_2026
          storeFile=../signing/release.jks
          storePassword=vdownloader_keystore_pass_2026
          EOF
          fi

      - name: Build Release APKs
        run: ./gradlew --no-daemon assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Prune previous GitHub releases
      - name: Delete Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning older releases from GitHub..."
          gh release list --limit 1000 --json tagName -q '.[].tagName' 2>/dev/null | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting release for tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            fi
          done || true

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-Downloader v3.6.11 - بطاقات قوائم التشغيل الموحدة، فتح المقاطع، والترجمة المدمجة
          tag_name: v3.6.11
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🌟 V-Downloader v3.6.11 - الإصدار الرسمي المستقر

            > 🚀 **تحديث رئيسي يجلب بطاقات قوائم التشغيل الموحدة للفيديو والصوت والترجمة، فتح المقاطع بعد الاكتمال، وتفعيل الترجمة المدمجة وإدارة الأذونات المباشرة.**

            ---

            ### 🔥 أبرز ما تم إنجازه في إصدار v3.6.11:

            #### 🎬 1. بطاقات قوائم التشغيل الموحدة والتجربة الشاملة (PlaylistBatchCard)
            * **توحيد بطاقات القوائم**: تصميم موحد فائق الجمال يدعم قوائم الفيديو، الصوتيات، والترجمة مع أيقونات مميزة لكل نوع (`VideoLibrary`، `MusicNote`، `Subtitles`).
            * **حفظ الترتيب والتسلسل**: ترقيم صارم ودقيق للعناصر (`01`، `02`، `03`...).
            * **فتح المقاطع فور الاكتمال**: إمكانية النقر على أي عنصر مكتمل في القائمة لفتحه وتشغيله مباشرة، مع زر فتح مخصص.
            * **تحكم مجمع كامل**: إيقاف مؤقت للكل، استئناف الكل، إلغاء، وفتح مجلد القائمة مباشرة.

            #### 📝 2. تنزيل الترجمة الفردية مباشرة والترجمة المدمجة
            * **حفظ مباشر دون مجلدات**: تنزيل الترجمة الفردية مباشرة في مجلد التنزيل بدون إنشاء مجلد قائمة فرعي وبدون ترقيم.
            * **تفعيل الترجمة المدمجة (Embed Subtitles)**: دمج الترجمة تلقائياً مع الفيديو بحاوية MKV المتوافقة بدون أي أخطاء.
            * **منع تحميل الترجمة مرتين**: تنقية اللغات ومنع الازدواجية وتسريع تنزيل ترجمات القوائم دون أخطاء 429.

            #### 🛡️ 3. إدارة الأذونات الدقيقة وGoogle Play
            * **توجيه مباشر للشاشات المخصصة**: توجيه فوري لشاشة إعدادات إشعارات التطبيق واستثناء تحسين البطارية.
            * **توافق كامل مع Google Play**: استخدام Scoped Storage القياسي وSAF للمجلدات المخصصة.

            #### 🔍 4. محرك فحص وتحميل الناقص (Playlist Verifier)
            * فحص دقيق لقوائم التشغيل وتنزيل العناصر المفقودة فقط بالترتيب والمسار الصحيحين.

