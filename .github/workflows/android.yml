name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          echo "Setting up permanent signing configuration..."
          if [ ! -f "keystore.properties" ]; then
            cat <<EOF > keystore.properties
          keyAlias=vdownloader
          keyPassword=vdownloader_keystore_pass_2026
          storeFile=../signing/release.jks
          storePassword=vdownloader_keystore_pass_2026
          EOF
          fi

      - name: Build Release APKs
        run: ./gradlew --no-daemon assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Prune previous GitHub releases
      - name: Delete Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning older releases from GitHub..."
          gh release list --limit 1000 --json tagName -q '.[].tagName' 2>/dev/null | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting release for tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            fi
          done || true

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-Downloader v3.6.22 - الإصلاح الشامل لمقاطع التواصل الاجتماعي، ترتيب قائمة التنزيلات، فتح المجلد عبر مديري الملفات، ودمج الترجمات
          tag_name: v3.6.22
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🚀 V-Downloader v3.6.22 — التحديث الشامل للاستقرار والتنظيم الفائق (Ultimate Precision & Stability Update)

            > 💎 **تحديث رئيسي يعالج المشكلات بدقة تامة: إصلاح استخراج وتنزيل مقاطع وسائل التواصل (Facebook / Instagram / TikTok)، تصحيح ترتيب قائمة التنزيل وموضع التنزيلات الجديدة في الأعلى، دعم فتح المجلد الفعلي عبر كافة مديري الملفات مع قائمة الاختيار (Chooser)، واستقرار دمج الترجمات داخل الفيديو.**

            ---

            ### 🌟 أبرز التحسينات والإصلاحات الشاملة في الإصدار v3.6.22:

            #### 📱 1. إصلاح استخراج وتنزيل مقاطع وسائل التواصل (Facebook, Instagram, TikTok)
            * **إصلاح معالجة روابط فيسبوك ومشاركات المقاطع**: تصحيح استخراج معرف الفيديو من روابط `/share/v/` و `/share/r/` وتجنب تحريف المعرفات أو إضافة شرطات زائدة لمنع خطأ `[facebook] 1: Cannot parse data`.
            * **تنظيف ذكي لمعلمات التتبع**: حذف معلمات التتبع (`fbclid`, `mibextid`, `igsh`, `si`) دون المساس ببيانات التنزيل الأساسية.

            #### 🔄 2. إصلاح ترتيب قائمة التنزيل وموضع العناصر الجديدة (Download Queue Sorting)
            * **ظهور التنزيلات الجديدة في الأعلى**: إعادة بناء هيكلة القائمة بحيث تظهر التنزيلات الفردية الجديدة فوراً في أعلى القائمة بحسب ترتيب `الأحدث تاريخاً` دون تأخيرها خلف بطاقات القوائم المجمعة.
            * **دقة خيارات الترتيب بالعربية**: تصحيح نصوص خيارات الترتيب لتكون واضحة ودقيقة (الأحدث تاريخاً / الأقدم تاريخاً / بحسب الاسم / الحجم).

            #### 📂 3. فتح المجلد الفعلي ودعم جميع مديري الملفات (All File Managers & Chooser)
            * **دعم شامل لكافة مديري الملفات**: إتاحة فتح المجلد الحقيقي المباشر باستخدام أي مدير ملفات مثبت على جهازك (Samsung My Files, Xiaomi File Manager, Files by Google, Solid Explorer, MiXplorer, ZArchiver, Total Commander, Cx Explorer, وغيرها).
            * **قائمة الاختيار الفورية (Intent Chooser)**: إظهار نافذة اختيار مدير الملفات المفضّل لديك مع منع الارتداد التلقائي لمجلد التنزيلات العام.

            #### 📝 4. استقرار دمج الترجمات داخل الفيديو (`--embed-subs`)
            * **توافق كامل مع حاويات MP4 و MKV**: دعم تحويل مسار الترجمة المدمج إلى `mov_text` لحاويات MP4 و `srt/ass` لحاويات MKV لمنع انهيار FFmpeg.
            * **توسيع لغات الترجمة**: استخراج وتضمين الترجمات لكافة اللغات المتاحة (`all`) افتراضياً، وتفضيل صيغ SRT النظيفة.

            #### 🎨 5. واجهة التنسيقات المخصصة وانبثاق الستارة السلس
            * **ترقية Material 3 ModalBottomSheet**: ظهور فوري وسلس لنافذة التنسيقات عند اختيار "مخصص"، وإغلاق الستارة فوراً في التنزيل التلقائي دون تعليق.

            ---

            ### 📦 ملفات التثبيت المتاحة (Download Assets):
            * `V-Downloader-arm64-v8a-release.apk` — للأجهزة الحديثة بمعمارية 64-bit (موصى به لمعظم الهواتف).
            * `V-Downloader-armeabi-v7a-release.apk` — للأجهزة الأقدم بمعمارية 32-bit.
            * `V-Downloader-universal-release.apk` — نسخة شاملة متوافقة مع جميع الأجهزة والمعالجات.

            ---
            *صُنِع بكل شغف لتقديم أفضل وأقوى تجربة تنزيل وسائط للأندرويد.* ❤️