name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          echo "Setting up permanent signing configuration..."
          if [ ! -f "keystore.properties" ]; then
            cat <<EOF > keystore.properties
          keyAlias=vdownloader
          keyPassword=vdownloader_keystore_pass_2026
          storeFile=../signing/release.jks
          storePassword=vdownloader_keystore_pass_2026
          EOF
          fi

      - name: Build Release APKs
        run: ./gradlew --no-daemon clean assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Prune previous GitHub releases
      - name: Delete Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning older releases from GitHub..."
          gh release list --limit 1000 --json tagName -q '.[].tagName' 2>/dev/null | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting release for tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            fi
          done || true

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-Downloader v3.5.4 - إصلاح التنزيل وإزالة الموسيقى بشكل نهائي
          tag_name: v3.5.4
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🌟 V-Downloader v3.5.4 - إصلاح نهائي شامل

            > 🔧 **إصلاح جذري لمشكلات التنزيل + محرك إزالة الموسيقى الجديد**

            ---

            ### 🔥 الإصلاحات الجوهرية في هذا الإصدار:

            #### 📥 1. إصلاح مشكلة التنزيل ("يقول اكتمل لكن لا توجد ملفات")
            * **إزالة `--force-overwrites`:** كانت تتسبب في تجاوز yt-dlp للملفات وتضليل منطق اكتشاف المسارات.
            * **نافذة اكتشاف الملفات 10 دقائق** (بدلاً من 5 دقائق) لاستيعاب التنزيلات البطيئة والملفات الكبيرة.
            * **مسح المجلد الأب** كاحتياط عند عدم إيجاد الملف في المجلد الرئيسي.
            * **إصلاح تسرب قفل الترجمة:** تصحيح خطأ منطقي كان يسبب تعطل مسار الترجمة في حالات خاصة.

            #### 🎵 2. محرك إزالة الموسيقى الجديد (100% محلي، بدون أي كود قديم)
            * **حذف كامل** لكل مراجع المحرك القديم من `VocalIsolationProcessor`.
            * **المحرك الجديد** (`MusicRemovalEngine`) يعمل حصريًا عبر: MusicDetector → NativeDspEngine/ONNX → SpeechProtection → ResidualSuppression.
            * **إصلاح خطأ نقل الملف** عبر أقسام التخزين المختلفة (cross-partition): استبدال `renameTo()` بـ `Files.move` + نسخ آمن كـ fallback.
            * **معالجة غير مدمرة:** عند فشل إزالة الموسيقى، يُحفظ الملف الأصلي ولا يُفقد التنزيل.

            #### 🔐 3. استقرار محسّن
            * جميع تحويلات الملفات تستخدم `try/catch` مع fallback آمن.
            * تسجيل تفصيلي (Logcat) لكل مرحلة لتسهيل التشخيص.