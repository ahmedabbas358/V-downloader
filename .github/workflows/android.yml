name: Build & Release V-Downloader APKs

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:


permissions:
  contents: write


concurrency:
  group: vdownloader-build-${{ github.ref }}
  cancel-in-progress: true


jobs:

  build:

    name: Build Release APKs

    runs-on: ubuntu-latest

    timeout-minutes: 45


    steps:


      - name: Checkout repository
        uses: actions/checkout@v4



      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle



      - name: Setup Android SDK
        uses: android-actions/setup-android@v3



      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4



      - name: Make gradlew executable
        run: chmod +x ./gradlew



      ##################################################
      # Release Signing Setup
      ##################################################

      - name: Create signing files

        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}


        run: |


          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: Missing KEYSTORE_BASE64 secret"
            exit 1
          fi


          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore



          printf "storeFile=release.keystore\n" > keystore.properties

          printf "keyAlias=%s\n" "$KEY_ALIAS" >> keystore.properties

          printf "keyPassword=%s\n" "$KEY_PASSWORD" >> keystore.properties

          printf "storePassword=%s\n" "$STORE_PASSWORD" >> keystore.properties



          echo "Keystore created successfully"

          ls -lh app/release.keystore

          echo "keystore.properties created"



      ##################################################
      # Build
      ##################################################

      - name: Clean project

        run: |

          ./gradlew clean --no-daemon



      - name: Build Generic Release APK

        run: |

          ./gradlew assembleGenericRelease \
          --no-daemon \
          --stacktrace



      ##################################################
      # Validate APK
      ##################################################

      - name: Find generated APKs

        run: |

          find app/build/outputs/apk \
          -type f \
          -name "*.apk"



      - name: Verify APK exists

        run: |


          APK_COUNT=$(find app/build/outputs/apk \
          -name "*.apk" | wc -l)



          if [ "$APK_COUNT" -eq 0 ]; then

            echo "ERROR: No APK generated"

            exit 1

          fi



      ##################################################
      # Verify Signing
      ##################################################

      - name: Verify APK signature

        run: |


          for apk in $(find app/build/outputs/apk -name "*.apk")

          do

            echo "Checking $apk"


            $ANDROID_HOME/build-tools/*/apksigner verify "$apk"


          done



      ##################################################
      # Upload APK
      ##################################################

      - name: Upload APK Artifact

        uses: actions/upload-artifact@v4


        with:

          name: V-Downloader-Release-APKs

          path: |

            app/build/outputs/apk/**/*.apk


          if-no-files-found: error



      ##################################################
      # GitHub Release
      ##################################################

      - name: Create GitHub Release

        if: startsWith(github.ref, 'refs/tags/v')


        uses: softprops/action-gh-release@v2


        with:

          files: |

            app/build/outputs/apk/**/*.apk


          generate_release_notes: true