name: Build & Release V-Downloader APKs

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:


permissions:
  contents: write


concurrency:
  group: vdownloader-build-${{ github.ref }}
  cancel-in-progress: true


jobs:

  build:

    name: Build Release APKs

    runs-on: ubuntu-latest

    timeout-minutes: 45


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4



      - name: Setup JDK 21
        uses: actions/setup-java@v4

        with:
          distribution: temurin
          java-version: "21"
          cache: gradle



      - name: Setup Android SDK
        uses: android-actions/setup-android@v3



      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4



      - name: Grant execute permission
        run: chmod +x ./gradlew



      ##################################################
      # Release Signing
      ##################################################

      - name: Prepare release signing

        if: github.event_name != 'pull_request'

        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

        run: |

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing KEYSTORE_BASE64 secret"
            exit 1
          fi


          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore



          cat > keystore.properties <<EOF

storeFile=release.keystore
keyAlias=$KEY_ALIAS
keyPassword=$KEY_PASSWORD
storePassword=$STORE_PASSWORD

EOF



      ##################################################
      # Build
      ##################################################

      - name: Clean project

        run: |

          ./gradlew clean --no-daemon



      - name: Build Generic Release APK

        run: |

          ./gradlew \
          assembleGenericRelease \
          --no-daemon \
          --stacktrace



      ##################################################
      # Validate Output
      ##################################################

      - name: List generated APKs

        run: |

          find app/build/outputs/apk \
          -type f \
          -name "*.apk"



      - name: Verify APK exists

        run: |

          APK_COUNT=$(find app/build/outputs/apk \
          -name "*.apk" | wc -l)


          if [ "$APK_COUNT" -eq 0 ]; then

            echo "No APK generated"

            exit 1

          fi



      ##################################################
      # Verify Signing
      ##################################################

      - name: Verify APK signatures

        run: |

          for apk in $(find app/build/outputs/apk -name "*.apk")
          do

            echo "Checking $apk"

            $ANDROID_HOME/build-tools/*/apksigner verify "$apk"

          done



      ##################################################
      # Upload APKs
      ##################################################

      - name: Upload APK artifacts

        uses: actions/upload-artifact@v4

        with:

          name: V-Downloader-APKs

          path: |

            app/build/outputs/apk/**/*.apk


          if-no-files-found: error



      ##################################################
      # GitHub Release
      ##################################################

      - name: Create GitHub Release

        if: startsWith(github.ref, 'refs/tags/v')

        uses: softprops/action-gh-release@v2

        with:

          files: |

            app/build/outputs/apk/**/*.apk

          generate_release_notes: true