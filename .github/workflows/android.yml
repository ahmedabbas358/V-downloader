name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          echo "Setting up permanent signing configuration..."
          if [ ! -f "keystore.properties" ]; then
            cat <<EOF > keystore.properties
          keyAlias=vdownloader
          keyPassword=vdownloader_keystore_pass_2026
          storeFile=../signing/release.jks
          storePassword=vdownloader_keystore_pass_2026
          EOF
          fi

      - name: Build Release APKs
        run: ./gradlew --no-daemon assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Prune previous GitHub releases
      - name: Delete Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning older releases from GitHub..."
          gh release list --limit 1000 --json tagName -q '.[].tagName' 2>/dev/null | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting release for tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            fi
          done || true

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-Downloader v3.6.8 - إصلاح الجودات الكاملة، دمج الصوت، وتطوير الترجمات والأذونات
          tag_name: v3.6.8
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🌟 V-Downloader v3.6.8 - الإصدار الرسمي المستقر

            > 🚀 **تحديث شامل يحل مشكلات الجودات المتاحة، ودمج الصوت عبر FFmpeg، والأذونات، وتبسيط واجهة الإعدادات، وإصلاح الترجمات الفردية والمدمجة.**

            ---

            ### 🔥 أبرز ما تم إنجازه في إصدار v3.6.8:

            #### 🎬 1. استعادة كافة جودات الفيديو (4K / 1440p / 1080p / 720p)
            * **إلغاء قفل الجودات في يوتيوب**: إزالة القيود التي كانت تحصر الجودات في 360p فقط، واستعادة تدفقات 4K (2160p) و 1440p و 1080p 60fps و 720p كاملة.
            * **تحديد الجودة التلقائي الذكي**: دعم التبديل التلقائي لأعلى جودة متوفرة لجميع الفيديوهات الرأسية والأفقية.

            #### 🔊 2. ضمان دمج الصوت مع الفيديو 100% عبر FFmpeg
            * **ربط مسار FFmpeg المدمج**: حقن مسار محرك FFmpeg تلقائياً في أوامر التنزيل والدمج (`--ffmpeg-location`).
            * دمج مسارات الفيديو والصوت المنفصلة بنجاح وبدون أي ملفات صامتة.

            #### 🛡️ 3. حل مشكلة الأذونات على Android 11+
            * **دعم Scoped Storage الأصلي**: تصحيح فحص إذن التخزين ليعمل بسلاسة تامة على Android 11 و 12 و 13 و 14 و 15 بدون تعليق الواجهة على "لم تمنح".
            * قصر طلب إذن SAF على الحالات التي يطلب فيها المستخدم صراحة الحفظ على بطاقة ذاكرة خارجية.

            #### 🎛️ 4. تبسيط واجهة الإعدادات وفصل قوائم التشغيل
            * **إخفاء خيارات القوائم للمقاطع المفردة**: إزالة ترقيم القوائم والمجلدات الفرعية عند تحميل مقطع مفرد لتجنب التشتيت.
            * **تثبيت تفضيلات اللغة**: منع تكرار النوافذ الحوارية لتأكيد اللغة عند اختيار التنزيل المخصص.

            #### 📝 5. إصلاح تحميل ودمج الترجمات
            * **دعم كامل للترجمة المدمجة (`Embed Subtitles`)**: دمج ملفات الترجمة بسلاسة داخل حاويات MP4 و MKV.
            * **تحميل الترجمات الفردية**: إصلاح جلب وحفظ ملفات الترجمة المستقلة بصيغ SRT و VTT و ASS.

