name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          echo "Setting up permanent signing configuration..."
          if [ ! -f "keystore.properties" ]; then
            cat <<EOF > keystore.properties
          keyAlias=vdownloader
          keyPassword=vdownloader_keystore_pass_2026
          storeFile=../signing/release.jks
          storePassword=vdownloader_keystore_pass_2026
          EOF
          fi

      - name: Build Release APKs
        run: ./gradlew --no-daemon clean assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Prune previous GitHub releases
      - name: Delete Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning older releases from GitHub..."
          gh release list --limit 1000 --json tagName -q '.[].tagName' 2>/dev/null | while read -r tag; do
            if [ "$tag" != "v3.5.0" ] && [ -n "$tag" ]; then
              echo "Deleting old release for tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            fi
          done || true

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-Downloader v3.5.0 - الإصدار الذهبي الشامل (التحديث التراكمي الأضخم)
          tag_name: v3.5.0
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🌟 V-Downloader v3.5.0 - الإصدار الذهبي الشامل

            > 🎉 **يسرنا تقديم التحديث التراكمي الأكبر والشامل لجميع التحسينات والإصلاحات مقارنة بالإصدارات السابقة!**

            ---

            ### 💎 أبرز ما يقدمه هذا الإصدار:

            #### 🔄 1. إمكانية التحديث المباشر فوق النسخ السابقة
            * تم تثبيت وتوحيد مفاتيح التوقيع الرسمية للتطبيق، بحيث يمكنك الآن تثبيت التحديث مباشرة فوق النسخة المثبتة على جهازك بدون الحاجة لحذف التطبيق نهائياً.

            #### ⚡ 2. المُزامن الذكي لقوائم التشغيل (Smart Sync)
            * **فحص المفقود بدقة تامة:** مقارنة أي مجلد في جهازك مع رابط قائمة التشغيل واكتشاف العناصر الناقصة فقط (فيديوهات، صوتيات، أو ترجمات).
            * **استقرار فوري للتحميل:** تم القضاء على مشكلة تخطي أو اختفاء العناصر الناقصة أثناء بدء التنزيل، ليتم تحميلها بالكامل إلى المجلد المخصص.

            #### 🎙️ 3. محرك عزل الموسيقى فائق القوة (200% Power)
            * **إزالة كاملة للآلات والموسيقى:** تحويل المقاطع والفيديوهات إلى أصوات بشرية نقية تماماً بدون أي خلفيات موسيقية أو تشويش، سواء عند تحميل الفيديو أو الصوتيات فقط.

            #### 📝 4. دعم الترجمات الفوري والترجمات التلقائية
            * **بحث متعدد اللغات باللغة العربية:** واجهة اختيار لغات الترجمة أصبحت تظهر بأسماء واضحة باللغة العربية مع إمكانية البحث المباشر (مثل البحث عن `العربية`).
            * **جلب الترجمات التلقائية واليدوية معاً:** تنزيل كافة الترجمات التلقائية المتاحة من يوتيوب بدون أي مشاكل، مع إمكانية دمجها مباشرة داخل الفيديو.

            #### 🎬 5. إتاحة جميع الجودات بدون قيود ودمج الصوت تلقائياً
            * عرض كافة الجودات المتاحة للمقاطع وقوائم التشغيل (من 360p وحتى 4K/8K) مع دمج الصوت والصورة بأعلى جودة تلقائياً.

            #### 🛡️ 6. توافق كامل مع أحدث إصدارات أندرويد (Android 16 / API 36)
            * حل كامل لمشاكل التنزيل من انستجرام ريلز (Instagram Reels) ويوتيوب على الأجهزة الحديثة لضمان حفظ الملفات بسلاسة في مجلد التنزيلات.

            ---

            ### 🇬🇧 Highlights in v3.5.0:
            * **Seamless Updates:** Standardized permanent signing allows installing updates directly over older versions.
            * **Rock-solid Smart Playlist Sync:** Compare directories and download missing items reliably with zero missing downloads.
            * **200% Vocal Isolation:** Studio-grade music and instrument removal for crystal-clear spoken audio.
            * **Full Subtitle Support:** Multi-language localized search and guaranteed auto-generated captions retrieval.
            * **Uncapped Resolutions:** 4K/8K format selection with automatic high-bitrate audio merging.
            * **Android 16 Ready:** 100% compatibility with modern Android storage for Instagram and YouTube.