name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          echo "Setting up permanent signing configuration..."
          if [ ! -f "keystore.properties" ]; then
            cat <<EOF > keystore.properties
          keyAlias=vdownloader
          keyPassword=vdownloader_keystore_pass_2026
          storeFile=../signing/release.jks
          storePassword=vdownloader_keystore_pass_2026
          EOF
          fi

      - name: Build Release APKs
        run: ./gradlew --no-daemon clean assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Prune previous GitHub releases
      - name: Delete Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning older releases from GitHub..."
          gh release list --limit 1000 --json tagName -q '.[].tagName' 2>/dev/null | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting release for tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            fi
          done || true

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-Downloader v3.5.7 - إعادة هندسة محرك الترجمات الشامل
          tag_name: v3.5.7
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🌟 V-Downloader v3.5.7 - التحديث الشامل لمحرك الترجمات

            > 🚀 **إعادة هندسة محرك تنزيل الترجمات بالكامل + تنزيل مباشر من CDN + فحص شامل للسلامة والترميز + معالجة الترجمات التلقائية وقوائم التشغيل**

            ---

            ### 🔥 أبرز ما تم تطويره في محرك الترجمات v3.5.7:

            #### ⚡ 1. تنزيل فائق السرعة عبر CDN المباشر (Direct HTTP Stream)
            * تنزيل مسارات الترجمة مباشرة من خوادم YouTube CDN بسرعة خيالية وبدون الحاجة لانتظار subprocess الخاص بـ yt-dlp، مع الإبقاء على yt-dlp كـ fallback تلقائي.

            #### 🛡️ 2. فحص وتدقيق السلامة المعمق (Deep Subtitle Validation & Coverage)
            * فحص كامل الملف والتأكد من ترتيب وصحة الـ Timestamps والـ Cues.
            * التحقق من تغطية الترجمة لنسبة معقولة من مدة الفيديو (Coverage Sanity Check) لكشف ومنع حفظ الترجمات المبتورة.
            * منع حفظ صفحات HTML Error أو أكواد 403 أو الملفات الفارغة.

            #### 🌐 3. محرك مطابقة لغوية ذكي (Multilingual & Arabic Name Normalizer)
            * دعم كامل لأسماء اللغات بالعربية والإنجليزية (مثل `العربية`, `Arabic`, `ar-SA`, `ar-EG`).
            * أولوية واضحة: Manual > Regional Manual > Auto-Generated > Auto-Translated.

            #### 🔄 4. تحويل فائق الدقة للصيغ (VTT ↔ SRT / ASS)
            * تنظيف متقدم لرموز الـ Rolling Captions في ترجمات YouTube التلقائية (`<00:00:01.000>`, `<c>`).
            * دعم كامل لترتيب النصوص ثنائية الاتجاه (RTL Arabic) ورموز Unicode.
            * ضبط دقيق للفواصل الزمنية (00:00:00,000 في SRT و 00:00:00.000 في VTT و 0:00:00.00 في ASS).

            #### 📁 5. كتابة ذرية وعزل تام في قوائم التشغيل (Atomic File Management)
            * التنزيل يتم داخل ملفات مؤقتة `.tmp` ولا يتم نقلها للاسم النهائي إلا بعد اجتياز الفحص بنجاح 100%.
            * عزل مهام كل فيديو في الـ Playlist بحيث لا يؤثر فشل ترجمة فيديو على باقي القائمة.