name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          echo "Setting up permanent signing configuration..."
          if [ ! -f "keystore.properties" ]; then
            cat <<EOF > keystore.properties
          keyAlias=vdownloader
          keyPassword=vdownloader_keystore_pass_2026
          storeFile=../signing/release.jks
          storePassword=vdownloader_keystore_pass_2026
          EOF
          fi

      - name: Build Release APKs
        run: ./gradlew --no-daemon assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Prune previous GitHub releases
      - name: Delete Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning older releases from GitHub..."
          gh release list --limit 1000 --json tagName -q '.[].tagName' 2>/dev/null | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting release for tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            fi
          done || true

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-Downloader v3.6.3 - التحميل الفعلي لقوائم الترجمات، إصلاح أزرار التحكم، وتصفية العناوين
          tag_name: v3.6.3
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🌟 V-Downloader v3.6.3 - الإصدار الرسمي المستقر

            > 🚀 **تحديث شامل يضمن التحميل الفعلي الدقيق لملفات الترجمة لكافة مقاطع القائمة دون تخطي وهمي، وتفعيل كامل لأزرار التحكم التجميعية (إيقاف مؤقت، استئناف، إلغاء، فتح المجلد)، وتنقية أسماء الملفات والعناوين.**

            ---

            ### 🔥 أبرز ما تم إنجازه في إصدار v3.6.3:

            #### 📥 1. إصلاح فحص الملفات المسبقة والتنزيل الحقيقي لكل مقاطع القائمة (`DownloadQueueManager`)
            * **إلغاء التطابق الخاطئ**: إزالة التطابق الجزئي لأسماء المقاطع المشتركة (مثل عناوين الدورات/المحاضرات) الذي كان يتسبب في تخطي التنزيل واعتبار المقاطع مكتملة وهمياً.
            * **التحميل الفعلي الكامل**: فحص صارم ومباشر للملفات بالـ Video ID والترقيم لضمان تحميل كل ملف ترجمة وحفظه فعلياً في مجلد القائمة على القرص.

            #### 🎛️ 2. تشغيل واستجابة كافة أزرار التحكم التجميعية (`PlaylistSubtitleBatchCard`)
            * **إيقاف مؤقت للكل**: إيقاف كافة العمليات النشطة وقيد الانتظار للدفعة بنقرة واحدة.
            * **استئناف الكل**: إعادة تشغيل كافة المقاطع المتوقفة تباعاً.
            * **إلغاء التنزيل**: إلغاء فوري لكافة مهام القائمة وقتل عمليات `yt-dlp` المرتبطة بها.
            * **فتح مجلد القائمة (`FileUtil.openDirectory`)**: فتح مجلد قائمة التشغيل مباشرة في تطبيق مدير الملفات.
            * **طي وتوسيع التفاصيل**: عرض قائمة تفصيلية لكافة مقاطع القائمة وحالة كل مقطع بنقاء تام.

            #### 🏷️ 3. تنقية العناوين والإحصائيات
            * إزالة بادئات `[Subtitle]` و `[Subtitles]` من العناوين والواجهات لعرض أسماء نقية وواضحة.
            * احتساب وعرض إحصائيات الترجمات بدقة في شريط الرأس (`X ترجمة`).

            #### 🛡️ 4. استقرار الأذونات وتحديث الحالة الفوري
            * تفعيل مراقب دورة الحياة لتحديث حالة الأذونات (ممنوح ✓) فور العودة من إعدادات النظام.
