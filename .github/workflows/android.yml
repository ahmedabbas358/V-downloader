name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          echo "Setting up signing configuration..."
          if [ ! -f "keystore.properties" ]; then
            keytool -genkeypair -v \
              -keystore release.jks \
              -alias vdownloader \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass vdownloader_keystore_pass_2026 \
              -keypass vdownloader_keystore_pass_2026 \
              -dname "CN=V-Downloader, OU=App, O=V-Downloader, L=Global, ST=Global, C=US"
            
            cat <<EOF > keystore.properties
          keyAlias=vdownloader
          keyPassword=vdownloader_keystore_pass_2026
          storeFile=../release.jks
          storePassword=vdownloader_keystore_pass_2026
          EOF
          fi

      - name: Build Release APKs
        run: ./gradlew --no-daemon clean assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Prune previous GitHub releases
      - name: Delete Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning older releases from GitHub..."
          gh release list --limit 100 --json tagName -q '.[].tagName' | while read -r tag; do
            if [ "$tag" != "v3.2.0" ] && [ -n "$tag" ]; then
              echo "Deleting old release for tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            fi
          done

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-Downloader v3.2.0 - عزل الموسيقى المتقدم، دعم الجودات المخصصة، واستقرار فائق
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v3.2.0' }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🚀 V-Downloader v3.2.0 - التحديث الجديد | What's New

            > ✨ **تحديث رئيسي جديد يحمل تحسينات شاملة على نقاء الصوت وخيارات التنزيل المخصصة واستقرار النظام.**

            ---

            ### 🎙️ 1. عزل الصوت وإزالة الموسيقى والآلات الموسيقية بدقة عالية
            * **نقاء استثنائي للصوت البشري:** تقنية معالجة صوتية ذكية متعددة المراحل تعمل على إزالة الموسيقى التصويرية والآلات الموسيقية من مقاطع الفيديو والملفات الصوتية بدقة متناهية مع الحفاظ الكامل على وضوح ونقاء الصوت الأصلي.
            * **معالجة مدمجة وسريعة:** تعمل الميزة محلياً بالكامل على جهازك بسرعة وكفاءة عالية ودون الحاجة لأي اتصال بالإنترنت أثناء المعالجة.

            ### 🎛️ 2. تحسينات شاملة على خيار "مخصص" لاختيار الجودات
            * **عرض كامل ودقيق لكافة الجودات:** إمكانية استعراض واختيار كافة التنسيقات المتاحة (فيديو، صوت فقط، دقة تصل إلى 4K) للمقاطع الفردية وقوائم التشغيل بكل سلاسة.
            * **مرونة أكبر في تخصيص التنزيلات:** تجربة محسّنة بالكامل عند اختيار الترجمات، دمج المسارات الصوتية، أو قص أجزاء محددة من المقاطع قبل بدء التنزيل.

            ### ⚡ 3. استقرار وسرعة وأداء أفضل
            * تحسين استقرار عمليات التحميل في الخلفية على أحدث إصدارات نظام أندرويد لمنع أي توقف مفاجئ.
            * سلاسة أعلى في التنقل بين شاشات التطبيق وسرعة أكبر في معالجة الروابط وقوائم التشغيل.

            ---

            ### 🇬🇧 What's New in v3.2.0:
            * **Advanced AI Vocal Isolation:** Multi-stage studio-grade voice extraction and instrument suppressor for crystal-clear offline speech.
            * **Full Custom Format Selection:** Completely overhauled custom format selector supporting all video/audio qualities for both single clips and playlists.
            * **Maximum Stability & Performance:** Enhanced background download service stability across all Android versions with seamless UI navigation.