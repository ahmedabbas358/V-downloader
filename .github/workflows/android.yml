name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          echo "Setting up permanent signing configuration..."
          if [ ! -f "keystore.properties" ]; then
            cat <<EOF > keystore.properties
          keyAlias=vdownloader
          keyPassword=vdownloader_keystore_pass_2026
          storeFile=../signing/release.jks
          storePassword=vdownloader_keystore_pass_2026
          EOF
          fi

      - name: Build Release APKs
        run: ./gradlew --no-daemon assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Prune previous GitHub releases
      - name: Delete Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning older releases from GitHub..."
          gh release list --limit 1000 --json tagName -q '.[].tagName' 2>/dev/null | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting release for tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            fi
          done || true

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-Downloader v3.6.0 - تحديث ترجمات القوائم والأذونات وسلاسة الأداء
          tag_name: v3.6.0
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🌟 V-Downloader v3.6.0 - الإصدار النهائي والمستقر

            > 🚀 **تحديث شامل لتنظيم وترقيم ترجمات قوائم التشغيل، واجهة اختيار الترجمات التلقائية واليدوية، طلب الأذونات الحقيقي، وتسريع التنقل الفائق.**

            ---

            ### 🔥 أبرز ما تم إنجازه في إصدار v3.6.0:

            #### 📂 1. تنظيم ترجمات قوائم التشغيل والترقيم وإدارة التعارض
            * **مجلد قائمة التشغيل النظيف**: إنشاء مجلد نظيف باسم قائمة التشغيل مباشرة وتفادي أي مجلدات عشوائية أو بادئات غير مرغوبة.
            * **الالتزام بالترقيم والتسلسل**: تنزيل ملفات الترجمة بالترتيب التسلسلي والالتزام الصارم بتفعيل أو إلغاء خيار الترقيم (`001 - Title.lang.srt` أو `Title.lang.srt`).
            * **إدارة التعارض**: خيارات دقيقة للتعامل مع الملفات والمجلدات الموجودة مسبقاً (استبدال / تكرار / تخطي / حذف وإعادة تنزيل).

            #### 🔁 2. قائمة تحميل الترجمات التتابعية ومحاولات الإعادة التلقائية
            * تنزيل ترجمات القائمة تباعاً في قائمة منظمة ومستقرة.
            * نظام محاولات تلقائية ذكي (حتى 3 محاولات مع Exponential Backoff) لكل ملف ترجمة على حدة لتفادي أي فشل ناتج عن الشبكة أو يوتيوب.

            #### 🌐 3. إصلاح واجهة اختيار الترجمة والتنسيق وحوار اللغات
            * حجب كامل لبطاقات وتنسيقات الصوت والفيديو عند اختيار تنزيل الترجمة فقط لمنع تداخلها.
            * فصل كامل ودقيق بين الترجمات اليدوية (`subtitles`) والترجمات التلقائية (`automaticCaptions`).
            * إصلاح قيود ارتفاع حوار اختيار اللغات وإضافة شريط بحث فعال وخيارات اختيار الكل وإلغاء التحديد.

            #### ⚡ 4. طلب الأذونات الحقيقي وسلاسة فائقة في التنقل
            * تفعيل طلب حقيقي وتفاعلي للأذونات (الإشعارات `POST_NOTIFICATIONS`، التخزين، واستثناء البطارية) مع شارات حالة فورية.
            * إزالة التنقلات المزدوجة المتتالية وتحسين رسوم الانتقال (Material 3 Tween) لضمان أداء فائق وسلس بدون أي تقطيع أو هبوط إطارات.