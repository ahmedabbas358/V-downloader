name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          echo "Setting up permanent signing configuration..."
          if [ ! -f "keystore.properties" ]; then
            cat <<EOF > keystore.properties
          keyAlias=vdownloader
          keyPassword=vdownloader_keystore_pass_2026
          storeFile=../signing/release.jks
          storePassword=vdownloader_keystore_pass_2026
          EOF
          fi

      - name: Build Release APKs
        run: ./gradlew --no-daemon assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Prune previous GitHub releases
      - name: Delete Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning older releases from GitHub..."
          gh release list --limit 1000 --json tagName -q '.[].tagName' 2>/dev/null | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting release for tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            fi
          done || true

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-Downloader v3.6.23 - الإصلاح النهائي لإيقاف التطبيق عند الخروج، وإصلاح تنزيل ترجمات قوائم التشغيل كاملة
          tag_name: v3.6.23
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🚀 V-Downloader v3.6.23 — التحديث الشامل للاستقرار والتنظيم الفائق (Ultimate Precision & Stability Update)

            > 💎 **تحديث رئيسي يعالج المشكلات بدقة تامة: إيقاف التطبيق فوراً وإخفاء الإشعار عند الخروج ما لم يُمنح إذن الخلفية، وإصلاح تنزيل ترجمات كامل مقاطع قائمة التشغيل (Playlist Subtitles) عبر التنزيل التلقائي والمخصص.**

            ---

            ### 🌟 أبرز التحسينات والإصلاحات الشاملة في الإصدار v3.6.23:

            #### 🛑 1. إيقاف التطبيق والخدمة فوراً عند الخروج وإخفاء الإشعار
            * **التحكم الصارم في العمل بالخلفية**: عند خروج المستخدم من التطبيق وإغلاقه، يتوقف التطبيق وتلغى المهام وتتوقف الخدمة ويختفي الإشعار تماماً ما لم يكن إذن العمل في الخلفية وتجاوز تحسين البطارية ممنوحاً صراحة من المستخدم.
            * **إنهاء الخدمة النظيف**: إصلاح `App.stopService()` و `onDestroy()` و `onTaskRemoved()` لإنهاء الـ Foreground Service وحذف كافة الإشعارات فور انتهاء التنزيلات أو إغلاق التطبيق.

            #### 📑 2. إصلاح تنزيل ترجمات قوائم التشغيل كاملة (تلقائي ومخصص)
            * **تنزيل كافة ترجمات القائمة**: حل المشكلة التي كانت تؤدي إلى تنزيل ترجمة مقطع واحد فقط عند اختيار تنزيل ترجمات القائمة؛ حيث يتم الآن التعرف الدقيق على روابط القوائم وجلب وإدراج كافة مقاطع القائمة بلا استثناء سواء في التنزيل التلقائي (Preset) أو المخصص (Custom Format).

            #### 📱 3. استقرار استخراج وسائل التواصل وروابط المشاركة (Facebook / Instagram / TikTok)
            * **معالجة معرفات فيسبوك**: تصحيح مسارات مشاركة فيسبوك `/share/v/` و `/share/r/` لمنع خطأ `[facebook] 1: Cannot parse data` وتنظيف معلمات التتبع فقط.

            #### 🔄 4. انضباط ترتيب التنزيلات وظهور العناصر الجديدة في الأعلى
            * **ترتيب دقيق**: تظهر التنزيلات الفردية الجديدة فوراً في أعلى قائمة التنزيلات بحسب تاريخ الإنشاء.

            #### 📂 5. فتح المجلد الفعلي عبر جميع مديري الملفات (Intent Chooser)
            * **قائمة اختيار شاملة**: إتاحة فتح المجلد المباشر بأي مدير ملفات مثبت على هاتفك دون الارتداد لمجلد التنزيلات العام.

            #### 📝 6. دمج الترجمات داخل الفيديو (`--embed-subs`)
            * **توافق الحاويات**: دعم `mov_text` لمقاطع MP4 وصيغ SRT النظيفة وتوسيع خيارات الترجمة إلى `all`.

            ---

            ### 📦 ملفات التثبيت المتاحة (Download Assets):
            * `V-Downloader-arm64-v8a-release.apk` — للأجهزة الحديثة بمعمارية 64-bit (موصى به لمعظم الهواتف).
            * `V-Downloader-armeabi-v7a-release.apk` — للأجهزة الأقدم بمعمارية 32-bit.
            * `V-Downloader-universal-release.apk` — نسخة شاملة متوافقة مع جميع الأجهزة والمعالجات.

            ---
            *صُنِع بكل شغف لتقديم أفضل وأقوى تجربة تنزيل وسائط للأندرويد.* ❤️