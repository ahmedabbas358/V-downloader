name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Release APKs
        run: ./gradlew --no-daemon clean assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-downloader v2.6.1
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            # 🚀 V-downloader v2.6.1 - التحديث الرئيسي الشامل (Major Release)

            > ⚠️ **تنبيه مهم جداً للمستخدمين | Crucial Update Notice:**
            > 🇸🇦 **عربي:** يُنصح بشدة **حذف النسخة القديمة المثبتة على جهازك قبل تثبيت هذا التحديث** (تثبيت جديد وليس تحديث مباشر فوق القديمة) لضمان عمل كافة الميزات والروابط الجديدة بسلاسة دون تعارض!
            > 🇬🇧 **English:** It is strongly recommended to **uninstall the previous version before installing this update** to ensure all new features work seamlessly without conflicts!

            ---

            ### 🔥 أبرز الميزات الجديدة والتحديثات | Main Release Highlights:

            #### 🎙️ 1. محرك عزل الموسيقى الاستوديوي (Music Removal & Vocal Extraction Engine):
            * **AR:** ميزة التنزيل بدون موسيقى للمقاطع والصوتيات وقوائم التشغيل عبر فلتر صوتي خماسي المراحل احترافي من FFmpeg.
            * **EN:** Studio-grade 5-stage FFmpeg audio filter pipeline for vocal extraction and background music removal for videos, audios, and playlists.

            #### 🔄 2. مُزامن قوائم التشغيل الذكي (Smart Playlist Synchronizer):
            * **AR:** فحص المجلدات المحلية ومقارنتها بقوائم التشغيل أونلاين وتنزيل العناصر المفقودة فقط بنقرة واحدة مع الترقيم الأصلي (`001 - `, `002 - `) واختيار الدقة والتسجيل.
            * **EN:** Compare local output directories with online playlists and complete missing tracks in one click with index numbering (`001 - `, `002 - `) and resolution selection.

            #### 🎛️ 3. وضع التحديد الجماعي المتقدم (Redesigned Multi-Selection Mode):
            * **AR:** شريط سفلي عائم تفاعلي يقدم خيارات إيقاف مؤقت، استئناف، إلغاء، وحذف المقاطع المحددة دفعة واحدة.
            * **EN:** Interactive floating bottom action bar for batch pause, resume, cancel, and delete.

            #### 📋 4. قائمة الثلاث نقاط التكيفية (Sectional 3-Dots Menu):
            * **AR:** قائمة خيارات ديناميكية ومخصصة لكل تبويب (الجميع، جار التحميل، تم الإلغاء، انتهى).
            * **EN:** Contextual 3-dots overflow menu customized for every filter tab (All, Downloading, Canceled, Finished).

            #### 📌 5. تحسينات الترجمات ودقة الأحجام (Subtitle & Size Fixes):
            * **AR:** إصلاح حلقة خيار الترجمات المخصص وتعميم لغة الترجمة والصيغة على كافة المقاطع، مع احتساب وعرض الكيلوبايتات الحقيقية لملفات الترجمة.
            * **EN:** Fixed subtitle format custom selection loop, applied subtitle languages across playlist items, and formatted true KB file sizes.