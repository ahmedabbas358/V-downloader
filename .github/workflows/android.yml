name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          echo "Setting up permanent signing configuration..."
          if [ ! -f "keystore.properties" ]; then
            cat <<EOF > keystore.properties
          keyAlias=vdownloader
          keyPassword=vdownloader_keystore_pass_2026
          storeFile=../signing/release.jks
          storePassword=vdownloader_keystore_pass_2026
          EOF
          fi

      - name: Build Release APKs
        run: ./gradlew --no-daemon assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Prune previous GitHub releases
      - name: Delete Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning older releases from GitHub..."
          gh release list --limit 1000 --json tagName -q '.[].tagName' 2>/dev/null | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting release for tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            fi
          done || true

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-Downloader v3.6.4 - تكامل إعدادات الترجمة، فتح المجلدات، والتحكم بالخلفية
          tag_name: v3.6.4
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🌟 V-Downloader v3.6.4 - الإصدار الرسمي المستقر

            > 🚀 **تحديث شامل يربط كافة إعدادات التنزيل والترجمات التلقائية والتنسيقات في واجهة الضبط، ويصلح فتح مجلد القائمة في مدير الملفات، وضبط إذن تشغيل الخلفية والبطارية بدقة.**

            ---

            ### 🔥 أبرز ما تم إنجازه في إصدار v3.6.4:

            #### ⚙️ 1. ترابط وتكامل لوحة ضبط الإعدادات قبل التنزيل (`Download Settings`)
            * **اختيار تنسيق الترجمة المباشر**: إضافة شريط اختيار تنسيق الترجمة (`SRT`, `VTT`, `ASS`, `LRC`) في الإعدادات الإضافية ليعكس خيارات المستخدم وتحديثها فورياً.
            * **الترجمة التلقائية والمترجمة**: تفعيل مفاتيح التبديل للترجمة التلقائية والترجمة الآلية المترجمة.
            * **خيارات قوائم التشغيل**: تفعيل خيارات ترقيم المقاطع (`001 - ...`) وإنشاء مجلد فرعي باسم القائمة مباشرة في شاشة الإعدادات.
            * **مزامنة نصوص الإعداد المسبق والمخصص**: عرض اللغات والتنسيق المختار بدقة في بطاقات الإعداد المسبق والمخصص.

            #### 📂 2. فتح مجلد القائمة مباشرة في مدير الملفات (`FileUtil.openDirectory`)
            * دعم متكامل لبروتوكول `DocumentsContract` و `SAF Tree` لتوجيه مدير الملفات إلى مجلد قائمة التشغيل الفعلي على القرص فور النقر على زر المجلد.

            #### 🔋 3. ضبط إذن البطارية واستمرار العمل في الخلفية
            * تفعيل نافذة طلب إذن البطارية مباشرة من النظام.
            * إلزام التطبيق بإنهاء خدمة التنزيل والتوقف الفوري عند إغلاق التطبيق في حال عدم منح إذن الخلفية/البطارية.

            #### 📥 4. استقرار محرك تحميل ترجمات قوائم التشغيل
            * إنشاء مجلد القائمة وتنزيل كافة ملفات الترجمة تباعاً بأسماء نقية ودون تخطي.
