name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          echo "Setting up permanent signing configuration..."
          if [ ! -f "keystore.properties" ]; then
            cat <<EOF > keystore.properties
          keyAlias=vdownloader
          keyPassword=vdownloader_keystore_pass_2026
          storeFile=../signing/release.jks
          storePassword=vdownloader_keystore_pass_2026
          EOF
          fi

      - name: Build Release APKs
        run: ./gradlew --no-daemon assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Prune previous GitHub releases
      - name: Delete Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning older releases from GitHub..."
          gh release list --limit 1000 --json tagName -q '.[].tagName' 2>/dev/null | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting release for tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            fi
          done || true

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-Downloader v3.6.19 - مجلد منفصل لترجمات كل قائمة تشغيل [Subtitles]، استقرار دمج الترجمات، محرك استئناف الناقص، وتحسينات الواجهة
          tag_name: v3.6.19
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🚀 V-Downloader v3.6.19 — التحديث الشامل للاستقرار والتنظيم (Ultimate Precision Update)

            > 💎 **تحديث رئيسي يحل مشاكل تنظيم مجلدات ترجمات قوائم التشغيل بشكل منفصل [Subtitles]، يضمن فتح المجلد الفعلي المباشر، يثبت دمج الترجمات داخل الفيديو، ويعيد بناء محرك فحص واستئناف التنزيلات الناقصة بدقة 100%.**

            ---

            ### 🌟 أبرز التحسينات والإصلاحات الجديدة في v3.6.19:

            #### 📂 1. مجلد منفصل وحصري لترجمات كل قائمة تشغيل (`[Subtitles] <اسم القائمة>`)
            * **عزل كامل لترجمات القوائم**: يتم الآن حفظ ملفات ترجمات كل قائمة تشغيل داخل مجلد فرعي مستقل يحمل اسم `[Subtitles] <اسم القائمة>` مع استخراج معرّف القائمة `listId` حتى لو كان الرابط بصيغة مشاركة مقطع `watch?v=...&list=...`.
            * **منع الحفظ في الفولدر العام**: القضاء التام على تسرب ملفات الترجمة إلى المجلد الجذري العام عند اختيار تنزيل ترجمات القائمة فقط.

            #### 🔍 2. الانتقال المباشر والدقيق لمجلد الملفات المكتملة
            * **فتح المجلد الحقيقي فوراً**: زر فتح المجلد يقودك مباشرة إلى المجلد الفعلي الذي تم إنشاء الملفات داخله بالاعتماد على مسار التنزيل الحقيقي المؤكد على القرص.
            * **توافق SAF و FileProvider شامل**: دعم فتح المجلدات عبر جميع إصدارات أندرويد (Android 11 حتى Android 16) وتجاوز قيود نظام إدارة الملفات DocumentsUI.

            #### 📝 3. استقرار دمج الترجمات داخل الفيديو (`--embed-subs`)
            * **معالجة متقدمة لقواعد الحاويات (MP4 vs MKV)**: التمييز التلقائي بين حاويات MP4 التي تتطلب نصوص `mov_text` بدون تحويلات خارجية، وبين حاويات MKV الداعمة لـ `SRT/ASS/VTT` لمنع انهيار FFmpeg أثناء المعالجة (Code 1).
            * **توسيع لغات الترجمة**: مطابقة قوية للغات العربية والإنجليزية مع جميع الوسوم الإقليمية (`ar-SA`, `ar-EG`, `ar-orig`, `en-US`) مع خيار استبعاد التعليق عند غياب الترجمة لبعض المقاطع (`--ignore-errors`).

            #### 🔄 4. إعادة بناء محرك فحص واستئناف الناقص (`Playlist Sync & Audit Engine`)
            * **حل مشكلة النقطة في الأسماء**: إصلاح خطأ اقتطاع أسماء المقاطع المحتوية على نقاط (مثل `Mr. Bean`, `v1.2`) واستبدالها بنظام فحص امتدادات الوسائط الدقيق.
            * **فحص المجلدات المتعددة**: البحث الذكي عن الملفات داخل مجلدات القوائم الفرعية، ومجلدات `[Subtitles]`، والمجلدات ذات الأسماء المقتطعة.
            * **مطابقة هجينة فائقة الذكاء (Fuzzy Token & Index Match)**: التعرف الأوتوماتيكي على الملفات المحملة بنسبة 100% حتى لو تم اقتطاع أسمائها من قِبل yt-dlp بسبب حد الحروف (200 Bytes) للغة العربية.

            #### 🎨 5. تحسينات الواجهة وتجربة المستخدم وعرض البيانات (UI / UX Polish)
            * **عرض البيانات الفنية بالإنجليزية الأنيقة**: بطاقات بيانات الوسائط (`ActionSheetInfo`)، شارات الدقة، معدلات البت (Bitrates)، الترميزات (Codecs: AVC1, VP9, Opus, AAC)، وأحجام الملفات بصيغة واضحة ومنظمة.
            * **تنسيق بطاقات القوائم ونافذة المزامنة**: شارات حصرية وواضحة لعدد العناصر المحملة والمفقودة وحالة الفحص لتسهيل الإدارة والاستئناف بلمسة واحدة.

            ---

            ### 📦 ملفات التثبيت المتاحة (Download Assets):
            * `V-Downloader-arm64-v8a-release.apk` — للأجهزة الحديثة بمعمارية 64-bit (موصى به لمعظم الهواتف).
            * `V-Downloader-armeabi-v7a-release.apk` — للأجهزة الأقدم بمعمارية 32-bit.
            * `V-Downloader-universal-release.apk` — نسخة شاملة متوافقة مع جميع الأجهزة والمعالجات.

            ---
            *صُنِع بكل شغف لتقديم أفضل وأقوى تجربة تنزيل وسائط للأندرويد.* ❤️