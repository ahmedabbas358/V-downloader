name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          echo "Setting up signing configuration..."
          if [ ! -f "keystore.properties" ]; then
            keytool -genkeypair -v \
              -keystore release.jks \
              -alias vdownloader \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass vdownloader_keystore_pass_2026 \
              -keypass vdownloader_keystore_pass_2026 \
              -dname "CN=V-Downloader, OU=App, O=V-Downloader, L=Global, ST=Global, C=US"
            
            cat <<EOF > keystore.properties
          keyAlias=vdownloader
          keyPassword=vdownloader_keystore_pass_2026
          storeFile=../release.jks
          storePassword=vdownloader_keystore_pass_2026
          EOF
          fi

      - name: Build Release APKs
        run: ./gradlew --no-daemon clean assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Prune previous GitHub releases
      - name: Delete Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning older releases from GitHub..."
          gh release list --limit 100 --json tagName -q '.[].tagName' | while read -r tag; do
            if [ "$tag" != "v3.4.0" ] && [ -n "$tag" ]; then
              echo "Deleting old release for tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            fi
          done

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-Downloader v3.4.0 - محرك العزل الصوتي فائق الدقة (DSP 200%)
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v3.4.0' }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🚀 V-Downloader v3.4.0 - التحديث الأضخم للصوتيات

            > ✨ **تمت ترقية محرك إزالة الموسيقى ليعمل بكفاءة 200% باستخدام أحدث خوارزميات معالجة الإشارة (DSP) المتقدمة!**

            ---

            ### 🎙️ 1. محرك العزل الصوتي فائق الدقة (AI-Simulated DSP)
            * **كفاءة مضاعفة 200%:** تم بناء سلسلة فلاتر معقدة وجديدة كلياً داخل التطبيق، تجمع بين تقنية `Mid-Side Extraction`، وخوارزمية `afftdn` (التي تحاكي تقليل الضوضاء بالذكاء الاصطناعي بناءً على الترددات)، وفلتر `anlmdn` (Non-Local Means).
            * **إبادة تامة للموسيقى:** يعمل المحرك الجديد على تفتيت الخلفيات الموسيقية والآلات وترك الصوت البشري نقيضاً وعالياً بفضل البوابات الصوتية الديناميكية (`Noise Gate`) والموازنة التلقائية.

            ### 📽️ 2. استقرار الجودات الكاملة 
            * **إتاحة جميع الجودات:** التغلب على القيود التي كانت تحصر التنزيلات في جودة 360p لبعض المقاطع، وتنزيل 4K بأقصى سرعة.
            * **دمج احترافي وموثوق:** دمج مثالي للترجمات بدون تكرار، مع دعم كامل لتنزيل قوائم التشغيل كصوتيات معزولة.

            ### 🇬🇧 What's New in v3.4.0:
            * **200% Better Vocal Isolation:** Completely rewritten Music Removal Engine using an advanced multi-stage DSP chain (Mid-Side, FFT Denoise, Dynamic Expanders) to aggressively eliminate background instruments.
            * **Ultimate Stability:** Includes all previous fixes for 360p locks, subtitle duplication, and playlist logic.