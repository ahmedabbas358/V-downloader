name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          echo "Setting up permanent signing configuration..."
          if [ ! -f "keystore.properties" ]; then
            cat <<EOF > keystore.properties
          keyAlias=vdownloader
          keyPassword=vdownloader_keystore_pass_2026
          storeFile=../signing/release.jks
          storePassword=vdownloader_keystore_pass_2026
          EOF
          fi

      - name: Build Release APKs
        run: ./gradlew --no-daemon assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Prune previous GitHub releases
      - name: Delete Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning older releases from GitHub..."
          gh release list --limit 1000 --json tagName -q '.[].tagName' 2>/dev/null | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting release for tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            fi
          done || true

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-Downloader v3.6.9 - تنظيف التخزين المؤقت وحل مشكلات التثبيت فوق النسخ القديمة
          tag_name: v3.6.9
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🌟 V-Downloader v3.6.9 - الإصدار الرسمي المستقر

            > 🚀 **تحديث شامل يحل مشكلات التثبيت فوق النسخ القديمة عبر تنظيف التخزين المؤقت والملفات التالفة تلقائياً، وتحديث محرك التنزيل، وضمان دمج الصوت وكافة الجودات.**

            ---

            ### 🔥 أبرز ما تم إنجازه في إصدار v3.6.9:

            #### 🔄 1. حل مشكلات التثبيت فوق النسخ القديمة (`UpgradeManager`)
            * **تنظيف تلقائي للملفات المؤقتة والمهملة**: مسح الملفات التالفة والجزئية ومجلدات التخزين المؤقت عند الترقية لضمان عمل التطبيق كنسخة جديدة كلياً بدون بقايا قديمة.
            * **إعادة ضبط وتصحيح التفضيلات المتعارضة**: تصحيح إعدادات بطاقة الذاكرة الخارجية SAF واستعادة الإعدادات السليمة لمنع أي تعليق في الواجهة.
            * **تحديث فوري لمحرك yt-dlp**: فرض تحديث محرك التنزيل فور الترقية لجلب أحدث المستخرجات وقواعد المنصات.

            #### 🎬 2. استعادة كافة جودات الفيديو (4K / 1440p / 1080p / 720p)
            * **إلغاء قفل الجودات في يوتيوب**: استعادة تدفقات 4K (2160p) و 1440p و 1080p 60fps و 720p كاملة.
            * **تحديد الجودة التلقائي الذكي**: التبديل التلقائي لأعلى جودة متوفرة لكافة المقاطع.

            #### 🔊 3. ضمان دمج الصوت مع الفيديو 100% عبر FFmpeg
            * **ربط مسار FFmpeg المدمج**: حقن مسار محرك FFmpeg تلقائياً في أوامر التنزيل والدمج (`--ffmpeg-location`).
            * دمج مسارات الفيديو والصوت المنفصلة بنجاح وبدون أي ملفات صامتة.

            #### 🛡️ 4. حل مشكلة الأذونات على Android 11+
            * **دعم Scoped Storage الأصلي**: فحص إذن التخزين بسلاسة على كافة إصدارات أندرويد بدون تعليق الواجهة.

            #### 🎛️ 5. تبسيط واجهة الإعدادات وفصل قوائم التشغيل
            * **إخفاء خيارات القوائم للمقاطع المفردة**: إزالة ترقيم القوائم والمجلدات الفرعية عند تحميل مقطع مفرد.
            * **تحميل ودمج الترجمات**: دعم الترجمة المدمجة والترجمات الفردية بصيغ SRT و VTT و ASS.

