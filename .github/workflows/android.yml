name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          echo "Setting up permanent signing configuration..."
          if [ ! -f "keystore.properties" ]; then
            cat <<EOF > keystore.properties
          keyAlias=vdownloader
          keyPassword=vdownloader_keystore_pass_2026
          storeFile=../signing/release.jks
          storePassword=vdownloader_keystore_pass_2026
          EOF
          fi

      - name: Build Release APKs
        run: ./gradlew --no-daemon assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Prune previous GitHub releases
      - name: Delete Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning older releases from GitHub..."
          gh release list --limit 1000 --json tagName -q '.[].tagName' 2>/dev/null | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting release for tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            fi
          done || true

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-Downloader v3.6.2 - إصلاح لوحة الأذونات والتحديث الفوري للحالة واستقرار التنزيل
          tag_name: v3.6.2
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🌟 V-Downloader v3.6.2 - الإصدار الرسمي المستقر

            > 🚀 **تحديث حاسم لإصلاح شاشة ولوحة طلب الأذونات، وتحديث الحالة الفوري (Lifecycle Observer) لضمان ثبات ودقة عرض الأذونات فور منحها.**

            ---

            ### 🔥 أبرز ما تم إنجازه في إصدار v3.6.2:

            #### 🛡️ 1. إصلاح واستقرار لوحة طلب الأذونات (`Onboarding Permissions Panel`)
            * **التحديث الفوري للحالة (Lifecycle Aware)**: تفعيل مراقب دورة الحياة (`ON_RESUME`) لإعادة التحقق من الأذونات فور عودة المستخدم من إعدادات النظام أو حوارات الأذونات، وعرض حالة "ممنوح ✓" فورياً دون تأخير أو ارتباك.
            * **إصلاح أذونات ومسارات التخزين**: تصحيح التحقق من Scoped Storage على Android 11+ ودعم اختيار مجلد التنزيل وإدارته بسلاسة.
            * **تحسين نصوص الشاشة**: توضيح أهمية منح الأذونات اللازمة للإشعارات والتخزين واستمرار التنزيل في الخلفية.

            #### 📊 2. واجهة شريط تقدم موحدة ومتطورة لترجمات قوائم التشغيل (`PlaylistSubtitleBatchCard`)
            * تجميع كافة ترجمات قائمة التشغيل في بطاقة واحدة أنيقة مع شريط تقدم تفاعلي وعرض المقطع الجاري تحميله حالياً.
            * أزرار تحكم كاملة دفعة واحدة (إيقاف/استئناف/إلغاء/فتح المجلد).

            #### 🔔 3. إلغاء العمليات وسياسة العمل في الخلفية
            * إلغاء فوري لعمليات `yt-dlp` والكوروتين عند النقر على "إلغاء"، وحذف الإشعار فوراً وإيقاف الخدمة عند خلو القائمة.
            * حصر استمرار التنزيل عند إغلاق التطبيق بالحصول على إذن العمل في الخلفية.


            #### 📁 4. تسمية الملفات والمجلدات بدقة تامة
            * إنشاء مجلد قائمة التشغيل باسم نقي مطابق لعنوان القائمة.
            * تسمية ملفات الترجمة باسم مقطع الفيديو النقي (`[001 - ]Clip Title.ar.srt`).
            * احترام خيار الترقيم وتطبيقه بدقة (`001 - `, `002 - `) في التسمية والواجهة.