name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 platforms;android-34 build-tools;34.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          echo "Setting up permanent signing configuration..."
          if [ ! -f "keystore.properties" ]; then
            cat <<EOF > keystore.properties
          keyAlias=vdownloader
          keyPassword=vdownloader_keystore_pass_2026
          storeFile=../signing/release.jks
          storePassword=vdownloader_keystore_pass_2026
          EOF
          fi

      - name: Build Release APKs
        run: ./gradlew --no-daemon assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Extract App Version dynamically from Version.kt
      - name: Extract App Version
        run: |
          MAJOR=$(grep -oE 'versionMajor\s*=\s*[0-9]+' buildSrc/src/main/kotlin/Version.kt | grep -oE '[0-9]+')
          MINOR=$(grep -oE 'versionMinor\s*=\s*[0-9]+' buildSrc/src/main/kotlin/Version.kt | grep -oE '[0-9]+')
          PATCH=$(grep -oE 'versionPatch\s*=\s*[0-9]+' buildSrc/src/main/kotlin/Version.kt | grep -oE '[0-9]+')
          APP_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "Extracted App Version: $APP_VERSION"

      # Prune previous GitHub releases
      - name: Delete Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning older releases from GitHub..."
          gh release list --limit 1000 --json tagName -q '.[].tagName' 2>/dev/null | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting release for tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            fi
          done || true

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-Downloader ${{ env.APP_VERSION }} — التحديث الشامل والإصلاحات الدقيقة
          tag_name: ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🚀 V-Downloader ${{ env.APP_VERSION }} — التحديث الشامل والإصلاحات الدقيقة

            > ⚡ **تحديث شامل لإصلاح الأخطاء الحرجة وتطوير الميزات وتوحيد الترجمة وتجربة المستخدم (v3.6.54).**

            ---

            ### ✨ أبرز التحسينات والإصلاحات في هذا الإصدار:

            * 🛡️ **استقرار الخدمة والإشعارات ودورة الحياة (Lifecycle & Concurrency)**:
              - إصلاح تزامن تهيئة `YoutubeDL`/`FFmpeg`/`Aria2c` عند الإقلاع البارد ومنع حالات السباق في `DownloadQueueManager` (`CoroutineStart.LAZY`).
              - فصل إشعار خدمة الخلفية عن إشعارات الاكتمال والأخطاء وتوحيد إدارة الخدمة بين `DownloaderV2` و`CustomCommandRunner` وحل تسريب سياق `MainActivity`.
              - إصلاح تجميد الواجهة الرئيسي عبر تحميل إصدار `yt-dlp` وقوالب الأوامر بشكل غير متزامن وآمن، ومنع أخطاء القسمة على صفر في التحديثات.
            * ⚙️ **دقة محرك التنزيل والصيغ والوسائط**:
              - إصلاح صياغة قوالب الإخراج (`newTitle.%(ext)s`) وتوافق مسار `subdirectoryExtractor` وإضافة تحويل `OPUS` في حوارات الإعدادات.
              - إصلاح `QuickDownloadActivity` (`onActionPost` و`onNewIntent`)، وتوسيع النافذة السفلية عند الجلب، وإصلاح مسار تنسيق الفيديو/الصوت للروابط المتعددة.
              - تحسين قص الوسائط بدون فقدان الجودة (`-ss` + `-t` مع تجنب تضارب الأسماء) ودعم توقيت WebVTT القصير في ضبط الترجمات.
            * 🎛️ **إكمال الميزات وتطوير UI & UX والترجمة**:
              - تفعيل الحذف الفعلي للملفات من قائمة الانتظار، معاينة ملفات الترجمة مباشرة، تفعيل خيار **مشغل الوسائط المدمج** من الإعدادات، وإكمال شاشة `DownloadEditorScreen` وشريط البحث في `SocialHubPage`.
              - معالجة شفافية الأسطح في الثيم العام وتوحيد كافة النصوص والرسائل بالعربية والإنجليزية بدون نصوص ثابتة غير مترجمة.

            ---

            ### 📦 ملفات التثبيت (Assets):
            * `V-Downloader-arm64-v8a-release.apk` — للأجهزة الحديثة (64-bit).
            * `V-Downloader-armeabi-v7a-release.apk` — للأجهزة الأقدم (32-bit).
            * `V-Downloader-universal-release.apk` — النسخة الشاملة لكافة الأجهزة.

            ---
            *صُنِع بكل شغف لتقديم أفضل وأقوى تجربة تنزيل وسائط للأندرويد.* ❤️