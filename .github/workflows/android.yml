name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Release APKs
        run: ./gradlew --no-daemon clean assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-Downloader v3.0.5 - سرعة استجابة الخيارات وإلغاء التكرار
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v3.0.5' }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🚀 V-Downloader v3.0.5 - سرعة استجابة الخيارات وإلغاء التكرار (Instant UI & Format Deduplication)

            > 🔥 **أبرز التحديثات في v3.0.5 | What's New:**
            > 🇸🇦 **عربي:** تحسين سرعة واستجابة التبديل بين الخيارات وإلغاء بطء واجهة "مخصص" (Custom)، وإلغاء التكرار في بطاقات الجودات والتنسيقات والترجمات.
            > 🇬🇧 **English:** Instant option switching performance, removal of custom format selection lag, and complete deduplication of format/subtitle cards.

            ---

            ## 🛠️ أبرز التحسينات والإصلاحات في v3.0.5 | v3.0.5 Improvements:

            ### ⚡ 1. استجابة فورية بدون تأخير (Instant Option & Tab Navigation):
            * **AR:** تسريع التبديل بين خيارات "مخصص" و "إعداد مسبق" وأقسام التنزيل وإلغاء التحريكات الثقيلة التي كانت تسبب تأخيراً في عرض الخيارات.
            * **EN:** Replaced heavy spring layout animations with crisp, instantaneous feedback on option selections and tab switching.

            ### 🧹 2. تنظيف وإلغاء تكرار التنسيقات (Format & Subtitle Deduplication):
            * **AR:** فلترة وإلغاء أي بطاقات جودة أو صوت أو ترجمة مكررة وحذف وسائط Storyboards غير القابلة للتشغيل تلقائياً.
            * **EN:** Enforced strict deduplication by format ID and language code, eliminating duplicate format cards and ghost items.

            ### 📂 3. تحسين طي وفتح الإعدادات الإضافية (Smooth Expandable Settings):
            * **AR:** دعم فتح وطي قسم الإعدادات الإضافية بسلاسة تامة وبدون تعليق.
            * **EN:** Enabled bidirectional toggle (expand/collapse) on additional settings with zero UI stutter.

            ---

            ## 🔥 الميزات السابقة (من v3.0.0) | Core Features:

            ### 🚀 1. نظام الأولوية القصوى واستئناف الشبكة الذكي (Priority Queueing & Auto-Resume):
            * **AR:** إمكانية تقديم أي مهمة تنزيل ونقلها إلى رأس الطابور فوراً عبر خيار "أولوية قصوى"، مع استئناف ومعالجة المهام العالقة تلقائياً عند عودة اتصال الإنترنت.
            * **EN:** Push any task to the top of the queue instantly with "Priority" action, and automatically resume pending downloads upon network reconnection.

            ### 🎙️ 2. عزل الموسيقى والمؤثرات بالذكاء الاصطناعي (AI Vocal Isolation & Speech Clarity):
            * **AR:** محرك استوديوي لعزل الموسيقى والضوضاء الخلفية بدون إنترنت لتحويل الفيديوهات إلى دروس صوتية نقية باستخدام FFmpeg.
            * **EN:** Native 5-stage FFmpeg acoustic audio pipeline for voice extraction, speech clarity enhancement, and background music removal offline.

            ### 📑 3. محرك استكمال وفحص قوائم التشغيل المطور (Smart Playlist Synchronizer):
            * **AR:** فحص الذاكرة والمجلدات ومقارنتها بقائمة التشغيل أونلاين وتنزيل الحلقات والمقاطع المفقودة فقط مع الترقيم الرقمي الصارم (#001, #002...).
            * **EN:** Deep local storage scanner to detect and download only missing playlist items with strict sequential index numbering.

            ### ✂️ 4. قص وتشذيب الوسائط الفوري (Instant Lossless Fast Media Trimmer):
            * **AR:** أداة لقص وتشذيب مقاطع الفيديو والصوتيات في أجزاء من الثانية دون إعادة ضغط للحفاظ على 100% من الجودة الأصلية.
            * **EN:** Ultra-fast stream-copy media cutter for videos and audios preserving 100% original quality without re-encoding.

            ### 📱 5. مشغل معاينة الوسائط المدمج (In-App Media Preview Player):
            * **AR:** معاينة المقاطع والصوتيات المحملة مباشرة داخل التطبيق دون الحاجة لفتحه في مشغل خارجي.
            * **EN:** Embedded lightweight media player for instant in-app video and audio previews.

            ### 💬 6. تنزيل الترجمات وضبط ومحاذاة التوقيت (Subtitles & Timestamp Shifter):
            * **AR:** تنزيل الترجمات المفردة بدقة، منع التكرار، وأداة لتقديم وتأخير التوقيت بالمللي ثانية مع التحويل بين SRT و VTT.
            * **EN:** Single subtitle downloader, duplicate prevention, and millisecond precision subtitle timing adjuster.

            ### 🎨 7. واجهة ترحيبية وتعليمية تفاعلية وإدارة التشغيل بالخلفية (Modern Onboarding & Permissions):
            * **AR:** واجهة ترحيبية بتصميم زجاجي حديث تشرح مزايا التطبيق وطريقة استخدامه مع إدارة ذكية لإذن الإشعارات واستثناء قيود البطارية للعمل بالخلفية.
            * **EN:** Interactive modern onboarding tour showcasing app features and streamlined permissions / background battery optimization setup.

            ### 🔔 8. شريط إشعارات تفاعلي مطور (Enhanced Notification UI/UX):
            * **AR:** إشعارات ملونة توضح السرعة الفورية ونسبة الإنجاز مع أزرار مباشرة لفتح الملف، مشاركته، أو إعادة المحاولة فوراً عند الخطأ.
            * **EN:** Color-coded rich notifications with real-time speed, live progress, and instant action buttons (Open, Share, Retry).