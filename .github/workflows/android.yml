name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          echo "Setting up permanent signing configuration..."
          if [ ! -f "keystore.properties" ]; then
            cat <<EOF > keystore.properties
          keyAlias=vdownloader
          keyPassword=vdownloader_keystore_pass_2026
          storeFile=../signing/release.jks
          storePassword=vdownloader_keystore_pass_2026
          EOF
          fi

      - name: Build Release APKs
        run: ./gradlew --no-daemon assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Prune previous GitHub releases
      - name: Delete Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning older releases from GitHub..."
          gh release list --limit 1000 --json tagName -q '.[].tagName' 2>/dev/null | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting release for tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            fi
          done || true

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-Downloader v3.6.31 — الاستقرار التام لتنزيل ترجمات القوائم ودمج الترجمة
          tag_name: v3.6.31
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🚀 V-Downloader v3.6.31 — التحديث الشامل لترجمات القوائم ودمج الترجمات داخل الفيديو

            > 💎 **تحديث يعيد الاستقرار الكامل لتنزيل ترجمات قوائم التشغيل دون تعليق أو توقف، ويضمن دمج الترجمات داخل الفيديو بنجاح 100%.**

            ---

            ### ✨ أبرز الإصلاحات في هذا الإصدار:

            * ⚡ **إصلاح تنزيل ترجمات قوائم التشغيل بالكامل (Playlist Subtitle Fix)**:
              - اعتماد عملاء YouTube الأكثر دعماً للترجمات (iOS & mWeb) بدلاً من عميل Android لتفادي حجب مسارات الترجمة.
              - معالجة ذكية وانسيابية للمقاطع التي لا تحتوي على ترجمة باللغة المطلوبة داخل القائمة لإكمال باقي المقاطع تلقائياً دون تجميد أو تعليق.
            * 📝 **دمج دائم وموثوق للترجمات داخل الفيديو (`--embed-subs`)**:
              - دمج مسارات الترجمة داخل حاوية MKV الموثوقة لمنع أي خطأ FFmpeg muxing وضمان ظهور الترجمة في مشغل التطبيق والمشغلات الخارجية.
            * 📁 **حفظ المقاطع العامة في مجلد التطبيق المباشر (Direct App Directory)**:
              - حفظ المقاطع الفردية والعامة مباشرة داخل مجلد التطبيق دون إنشاء مجلد Playlist.

            ---

            ### 📦 ملفات التثبيت (Assets):
            * `V-Downloader-arm64-v8a-release.apk` — للأجهزة الحديثة (64-bit).
            * `V-Downloader-armeabi-v7a-release.apk` — للأجهزة الأقدم (32-bit).
            * `V-Downloader-universal-release.apk` — النسخة الشاملة لكافة الأجهزة.

            ---
            *صُنِع بكل شغف لتقديم أفضل وأقوى تجربة تنزيل وسائط للأندرويد.* ❤️