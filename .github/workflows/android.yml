name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          echo "Setting up permanent signing configuration..."
          if [ ! -f "keystore.properties" ]; then
            cat <<EOF > keystore.properties
          keyAlias=vdownloader
          keyPassword=vdownloader_keystore_pass_2026
          storeFile=../signing/release.jks
          storePassword=vdownloader_keystore_pass_2026
          EOF
          fi

      - name: Build Release APKs
        run: ./gradlew --no-daemon assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Prune previous GitHub releases
      - name: Delete Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning older releases from GitHub..."
          gh release list --limit 1000 --json tagName -q '.[].tagName' 2>/dev/null | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting release for tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            fi
          done || true

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-Downloader v3.6.12 - التنظيم الذكي لقوائم التشغيل، استقرار الترجمة، ومعاينة الوسائط
          tag_name: v3.6.12
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🚀 V-Downloader v3.6.12 — الإصدار الذهبي المستقر (Ultimate Stable Release)

            > 💎 **تحديث شامل يجمع كافة التحسينات والإصلاحات الجذرية الممتدة من إصدارات (5 - 8 أغسطس) حتى الإصدار الحالي v3.6.12، مع التركيز على التنظيم التلقائي للمجلدات، استقرار الترجمات، محرك المعاينة الجديد، وإدارة الأذونات والتخزين بدقة متناهية.**

            ---

            ### 🌟 سجل التحديثات والإصلاحات الشامل (5 أغسطس — 26 أغسطس):

            #### 📂 1. التنظيم الذكي والدقيق لمجلدات قوائم التشغيل (Playlist Subdirectory Engine)
            * **مجلد مخصص باسم قائمة التشغيل**: حل نهائي وشامل لمشكلة حفظ ترجمات وقوائم التشغيل في المجلد العام؛ حيث يتم الآن إنشاء وحفظ كافة ملفات القائمة (فيديو، صوت، ترجمات) داخل مجلد يحمل **الاسم الحقيقي لقائمة التشغيل** تلقائياً.
            * **دعم الدقة العالية لملفات الفيديو والصوت**: تطبيق محرك التوجيه الذكي `-P` لتفادي أخطاء القوالب ولضمان تنزيل الفيديوهات والصوتيات بأعلى جودة مع مساراتها الصحيحة دون فقدان.
            * **زر فتح المجلد المباشر**: فتح المجلد الفعلي لقائمة التشغيل فوراً من بطاقة القائمة الموحدة.

            #### ⚡ 2. القضاء التام على فشل التنزيل الوهمي (Zero False-Negative Engine)
            * **حل مشكلة "الملف محمل لكن يعطي فشل"**: تم تحديث `SubtitleDownloader` و`PostDownloadCoordinator` و`SubtitleValidator` لاكتشاف وتسجيل الملفات المكتملة فوراً وتجاوز فروقات التسمية ورموز UTF-8 BOM وتنسيقات RTL العربية.
            * **الاسترداد التلقائي للملفات**: فحص المجلد الوجهة قبل وبعد التنزيل؛ إذا وُجد الملف سليماً يتم اعتماده فوراً بنجاح 100% دون إظهار أي رسالة خطأ.
            * **معالجة الترجمة المدمجة (`--embed-subs`)**: دمج سلس ودقيق لملفات الترجمة داخل حاويات الفيديو (MKV/MP4) بنقرة زر واحدة في صفحة التخصيص.

            #### 🎬 3. محرك المعاينة وتشغيل الوسائط المطور (Media & Subtitle Preview Engine)
            * **واجهة عصرية بتصميم Material 3**: تحسين شامل لتجربة المستخدم (UI & UX) وتجاوب الشاشة مع كافة الأبعاد (من مقاطع Shorts العمودية 9:16 إلى الفيديوهات العريضة 16:9).
            * **قارئ الترجمات المدمج**: وضع خاص لعرض نصوص ملفات الترجمة (`.srt`، `.vtt`، `.ass`، `.lrc`) مع التوقيت والبحث اللحظي داخل النص.
            * **التحكم بالسرعة والمشغل الخارجي**: إمكانية تغيير سرعة التشغيل من (0.5x إلى 2.0x) وزر مخصص للفتح المباشر في أي مشغل خارجي مثبت (VLC، MX Player، وغيرها).
            * **حل مشكلة فتح الملف المحمل**: إصلاح `FileProvider` و`provider_paths.xml` وتوفير وصول آمن لكافة مسارات التخزين دون أخطاء أمنية.

            #### 🌐 4. المطابقة الذكية للغات والترجمات المخصصة
            * **تحديد لغات الترجمة بدقة**: حل مشكلة إعادة رسالة "لم تختر اللغة" عند اختيار تخصيص التنسيق عبر محرك `LanguageMatcher`.
            * **دعم اللهجات والوسوم البديلة**: مطابقة تلقائية للغة العربية بكافة أشكالها (`ar`, `ar-SA`, `ar-EG`, `ar-orig`) والتعبيرات النمطية.
            * **فصل الترجمات الرسمية عن الترجمات التلقائية**: تمييز دقيق بين الترجمة المرفوعة يدوياً والترجمة المولدة بالذكاء الاصطناعي مع إمكانية التحديد المتعدد.

            #### 🛡️ 5. إدارة الأذونات والترقية النظيفة (Permissions & Cache Purge)
            * **فحص حقيقي وصارم للأذونات**: التوقف عن إعطاء إذن التخزين الممنوح وهمياً قبل طلبه؛ حيث يتم الآن التحقق الفعلي من صلاحيات نظام Android 13+ (`READ_MEDIA_*`) وAndroid 11+ (`MANAGE_EXTERNAL_STORAGE`).
            * **توجيه مباشر ودقيق لإعدادات النظام**: النقر على زر الإذن يفتح الشاشة المخصصة مباشرة (إدارة كافة الملفات أو استثناء البطارية).
            * **ترقية نظيفة وتنظيف المخلفات**: محرك `UpgradeManager` يقوم تلقائياً بمسح الكاش القديم لـ yt-dlp ومسح أقفال الملفات (`.part`, `.aria2`, `sub_temp_*`) عند تثبيت أي تحديث جديد لضمان عدم انتقال مشاكل الإصدارات السابقة.

            #### 🎼 6. محرك عزل الموسيقى المتقدم (Hammil / BS-RoFormer Vocal Isolation)
            * استقرار كامل لمحرك عزل الصوت والموسيقى بدقة احترافية ومكتبات معالجة عالية الأداء تم بناؤها وتثبيتها من إصدارات أغسطس.

            ---

            ### 📦 ملفات التثبيت المتاحة (Download Assets):
            * `V-Downloader-arm64-v8a-release.apk` — للأجهزة الحديثة بمعمارية 64-bit (موصى به لمعظم الهواتف).
            * `V-Downloader-armeabi-v7a-release.apk` — للأجهزة الأقدم بمعمارية 32-bit.
            * `V-Downloader-universal-release.apk` — نسخة شاملة متوافقة مع جميع الأجهزة والمعالجات.

            ---
            *صُنِع بكل شغف لتقديم أفضل وأقوى تجربة تنزيل وسائط للأندرويد.* ❤️

