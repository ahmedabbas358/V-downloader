name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          echo "Setting up permanent signing configuration..."
          if [ ! -f "keystore.properties" ]; then
            cat <<EOF > keystore.properties
          keyAlias=vdownloader
          keyPassword=vdownloader_keystore_pass_2026
          storeFile=../signing/release.jks
          storePassword=vdownloader_keystore_pass_2026
          EOF
          fi

      - name: Build Release APKs
        run: ./gradlew --no-daemon assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Extract App Version dynamically from Version.kt
      - name: Extract App Version
        run: |
          MAJOR=$(grep -oE 'versionMajor\s*=\s*[0-9]+' buildSrc/src/main/kotlin/Version.kt | grep -oE '[0-9]+')
          MINOR=$(grep -oE 'versionMinor\s*=\s*[0-9]+' buildSrc/src/main/kotlin/Version.kt | grep -oE '[0-9]+')
          PATCH=$(grep -oE 'versionPatch\s*=\s*[0-9]+' buildSrc/src/main/kotlin/Version.kt | grep -oE '[0-9]+')
          APP_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "Extracted App Version: $APP_VERSION"

      # Prune previous GitHub releases
      - name: Delete Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning older releases from GitHub..."
          gh release list --limit 1000 --json tagName -q '.[].tagName' 2>/dev/null | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting release for tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            fi
          done || true

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-Downloader ${{ env.APP_VERSION }} — التحديث الشامل والإصلاحات الدقيقة
          tag_name: ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🚀 V-Downloader ${{ env.APP_VERSION }} — التحديث الشامل والإصلاحات الدقيقة

            > ⚡ **تحديث شامل يحل مشكلات دمج الترجمات وتنزيل قوائم الترجمة، ويضبط مسارات حفظ المقاطع وتخصيص المجلدات من الإعدادات، مع تحكم كامل وإدارة ذكية للملفات.**

            ---

            ### ✨ أبرز التحسينات في هذا الإصدار:

            * 📂 **حفظ المقاطع العامة وتخصيص المجلدات بدقة عالية**:
              - حفظ كافة المقاطع والملفات الفردية والعامة مباشرة في مجلد التنزيل العام دون إنشاء أي مجلد داخلي باسم `Playlist`.
              - قصر إنشاء المجلدات الفرعية فقط على عناصر قوائم التشغيل الفعلية.
              - دعم كامل ودقيق لاختيار وتغيير مجلد التنزيل من الإعدادات عبر نظام SAF ووحدات التخزين وبطاقات SD.
            * 📝 **دمج موثوق وشامل للترجمات (`--embed-subs`)**:
              - إصلاح دمج ملفات الترجمة تلقائياً داخل حاويات MP4 و MKV دون أخطاء.
              - تفعيل تنزيل وترجمة الكابشن التلقائي آلياً عند طلب دمج الترجمة أو تنزيلها لكافة صيغ اللغات (`ar.*`, `ar`, `ar-orig`, `.*-ar`).
            * ⚡ **تسريع وسلاسة تنزيل ترجمات القوائم (Fast & Anti-Ban)**:
              - وتيرة تنزيل سريعة وانسيابية مع حماية متقدمة ضد حظر أو تجميد الاتصال من خوادم اليوتيوب وحل مشكلة التوقف في دائرة البداية.
            * 🎛️ **شريط تحكم متكامل لقوائم التشغيل**:
              - خيارات جماعية سلسة (استئناف، إيقاف، إعادة المحاولة، وفتح المجلد)، مع إمكانية إدارة وتخصيص كل مقطع على حدة.
            * 🛡️ **القضاء على تجميد الواجهة (No Hang & ANR)**:
              - معالجة تعليق القائمة السفلية والتنزيل التلقائي وتأمين تزامن العمليات في الخلفية.

            ---

            ### 📦 ملفات التثبيت (Assets):
            * `V-Downloader-arm64-v8a-release.apk` — للأجهزة الحديثة (64-bit).
            * `V-Downloader-armeabi-v7a-release.apk` — للأجهزة الأقدم (32-bit).
            * `V-Downloader-universal-release.apk` — النسخة الشاملة لكافة الأجهزة.

            ---
            *صُنِع بكل شغف لتقديم أفضل وأقوى تجربة تنزيل وسائط للأندرويد.* ❤️