name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          echo "Setting up permanent signing configuration..."
          if [ ! -f "keystore.properties" ]; then
            cat <<EOF > keystore.properties
          keyAlias=vdownloader
          keyPassword=vdownloader_keystore_pass_2026
          storeFile=../signing/release.jks
          storePassword=vdownloader_keystore_pass_2026
          EOF
          fi

      - name: Build Release APKs
        run: ./gradlew --no-daemon assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Prune previous GitHub releases
      - name: Delete Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning older releases from GitHub..."
          gh release list --limit 1000 --json tagName -q '.[].tagName' 2>/dev/null | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting release for tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            fi
          done || true

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-Downloader v3.6.1 - واجهة ترجمات القوائم الموحدة، الأذونات التلقائية، وإصلاح الإشعارات والخلفية
          tag_name: v3.6.1
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🌟 V-Downloader v3.6.1 - الإصدار الرسمي المستقر

            > 🚀 **تحديث شامل يضم واجهة شريط تقدم موحدة ومتطورة لترجمات قوائم التشغيل، طلب الأذونات الذكي مع التنفيذ الفوري، وإصلاح كامل لإلغاء الإشعارات والعمل في الخلفية.**

            ---

            ### 🔥 أبرز ما تم إنجازه في إصدار v3.6.1:

            #### 📊 1. واجهة شريط تقدم موحدة ومتطورة لتحميل ترجمات قوائم التشغيل (`PlaylistSubtitleBatchCard`)
            * **بطاقة تجميعية متطورة**: تجميع كافة ترجمات قائمة التشغيل في بطاقة واحدة أنيقة بدلاً من تكديس عشرات البطاقات المنفصلة.
            * **إحصائيات دقيقة وشريط تقدم سلس**: عرض عدد المقاطع المنجزة والإجمالي (`تم تنزيل X من Y مقطع`) ونسبة الإنجاز المئوية.
            * **عرض العملية الجارية**: بطاقة فرعية حركية توضح اسم المقطع الجاري تحميله حالياً مع مؤشر نشاط.
            * **تحكم كامل**: أزرار مدمجة لإيقاف/استئناف/إلغاء التنزيل دفعة واحدة وفتح مجلد القائمة وعرض تفاصيل المقاطع.

            #### 🔒 2. طلب الأذونات الذكي والتنفيذ الفوري للإجراء
            * طلب أذونات الإشعارات والتخزين واستثناء البطارية بطريقة مركزية.
            * **التنفيذ التلقائي الفوري**: عند منح المستخدم للإذن، يتم بدء التنزيل أو الإجراء المطلوب تلقائياً دون الحاجة للنقر مرة أخرى.

            #### 🔔 3. إصلاح الإشعارات، إلغاء العمليات، والعمل في الخلفية
            * إلغاء فوري لكافة عمليات `yt-dlp` والكوروتين عند الضغط على "إلغاء" من شريط الإشعارات أو التطبيق.
            * إزالة فورية للإشعارات وإنهاء خدمة التنزيل `DownloadService` عند خلو قائمة الانتظار لمنع بقاء الإشعارات عالقة.
            * حصر استمرار التنزيل عند إغلاق التطبيق بالحصول على إذن العمل في الخلفية (استثناء تحسين البطارية)، وإيقاف كافة العمليات وتفريغ الذاكرة فوراً إذا لم يكن الإذن ممنوحاً.

            #### 📁 4. تسمية الملفات والمجلدات بدقة تامة
            * إنشاء مجلد قائمة التشغيل باسم نقي مطابق لعنوان القائمة.
            * تسمية ملفات الترجمة باسم مقطع الفيديو النقي (`[001 - ]Clip Title.ar.srt`).
            * احترام خيار الترقيم وتطبيقه بدقة (`001 - `, `002 - `) في التسمية والواجهة.