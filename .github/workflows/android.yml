name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          echo "Setting up permanent signing configuration..."
          if [ ! -f "keystore.properties" ]; then
            cat <<EOF > keystore.properties
          keyAlias=vdownloader
          keyPassword=vdownloader_keystore_pass_2026
          storeFile=../signing/release.jks
          storePassword=vdownloader_keystore_pass_2026
          EOF
          fi

      - name: Build Release APKs
        run: ./gradlew --no-daemon clean assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Prune previous GitHub releases
      - name: Delete Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning older releases from GitHub..."
          gh release list --limit 1000 --json tagName -q '.[].tagName' 2>/dev/null | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting release for tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            fi
          done || true

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-Downloader v3.5.8 - دمج محرك Ultimate Vocal Remover (UVR) الشامل
          tag_name: v3.5.8
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🌟 V-Downloader v3.5.8 - دمج محرك Ultimate Vocal Remover (UVR) الرسمي

            > 🎧 **إعادة هندسة نظام إزالة الموسيقى وفصل الصوت بالكامل واستبدال المحركات السابقة بـ Ultimate Vocal Remover (UVR) المتكامل**

            ---

            ### 🔥 أبرز ما تم إنجازه في محرك إزالة الموسيقى UVR v3.5.8:

            #### 🧠 1. اعتماد معمارية Ultimate Vocal Remover (UVR) كالمحرك الوحيد والأساسي
            * استبدال كافة المحركات القديمة بمحرك UVR المتكامل القائم على ONNX Runtime مع تسريع المعالجة محلياً (On-device Hardware Acceleration).
            * دعم رسمي لأحدث معماريات UVR:
              1. **UVR MDX23C Vocals** (معمارية Dilated Dense Spectrogram المتقدمة).
              2. **UVR MDX-Net Vocals HQ** (معمارية Multi-scale Dilated DenseNet).
              3. **UVR Cascaded VR Arch** (معمارية U-Net Cascaded Spectrogram).
              4. **UVR HTDemucs v4 Hybrid** (معمارية Hybrid Transformer Cross-Domain).

            #### 🗣️ 2. التركيز على حماية الصوت البشري (Speech & Vocal Dynamics Preservation)
            * الحفاظ الكامل على نغمات ومخارج الحروف (Formants من 120Hz إلى 3800Hz) وعزل الآلات الخلفية بدقة فائقة دون تشويه الصوت أو تأثير Karaoke المبتور.

            #### 🧹 3. تصفية البقايا الموسيقية (Deep Residual Suppression)
            * كتم الترددات تحت الصوتية (<120Hz at -46dB) والترددات العالية للطبول والصنوج (>4800Hz) لضمان نقاء تام للمسار الصوتي.

            #### ⚡ 4. كتابة ذرية وضمان عدم فقدان الملفات (Atomic File Management)
            * المعالجة تتم داخل ملفات مؤقتة مع فحص شامل لسلامة الناتج قبل النقل الذري للاسم النهائي.
            * تكامل تام مع الـ Download Queue و Playlist Processing و Background Workers.