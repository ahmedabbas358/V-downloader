name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          echo "Setting up signing configuration..."
          if [ ! -f "keystore.properties" ]; then
            keytool -genkeypair -v \
              -keystore release.jks \
              -alias vdownloader \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass vdownloader_keystore_pass_2026 \
              -keypass vdownloader_keystore_pass_2026 \
              -dname "CN=V-Downloader, OU=App, O=V-Downloader, L=Global, ST=Global, C=US"
            
            cat <<EOF > keystore.properties
          keyAlias=vdownloader
          keyPassword=vdownloader_keystore_pass_2026
          storeFile=../release.jks
          storePassword=vdownloader_keystore_pass_2026
          EOF
          fi

      - name: Build Release APKs
        run: ./gradlew --no-daemon clean assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Prune previous GitHub releases
      - name: Delete Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning older releases from GitHub..."
          gh release list --limit 100 --json tagName -q '.[].tagName' | while read -r tag; do
            if [ "$tag" != "v3.3.0" ] && [ -n "$tag" ]; then
              echo "Deleting old release for tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            fi
          done

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-Downloader v3.3.0 - التحديث الشامل: جودات كاملة، وإصلاحات جذرية للترجمة والصوتيات
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v3.3.0' }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🚀 V-Downloader v3.3.0 - الإصدار الجديد

            > ✨ **تحديث محوري يحل بشكل جذري مشاكل الجودة، الترجمات، واستخراج الصوتيات.**

            ---

            ### 📽️ 1. فتح كافة خيارات الجودة (تخطي قيود 360p)
            * **إتاحة جميع الجودات:** تم التغلب على القيود التي كانت تحصر التنزيلات في جودة 360p لبعض المقاطع، لتتمكن الآن من التحميل بأعلى جودة متوفرة (تصل إلى 4K) وبلا انقطاع.
            * **دمج ذكي للصوت والفيديو:** يضمن التطبيق الآن دمج أفضل مسار صوتي تلقائياً مع كافة خيارات دقة الفيديو لضمان أعلى مستوى من تجربة المشاهدة.

            ### 📝 2. محرك ترجمة دقيق وخالٍ من الأخطاء
            * **إصلاح تكرار الترجمات:** يعالج هذا التحديث مشكلة التنزيل المزدوج لملفات الترجمة (اليدوية والتلقائية)، بحيث يتم تنزيل النسخة الأمثل بملف واحد نظيف.
            * **دمج احترافي:** تم حل جميع مشاكل دمج الترجمات داخل المقاطع وتنزيلها بشكل منفصل، مما يضمن عرض الترجمة بسلاسة تامة.

            ### 🎵 3. أداء مثالي للصوتيات وعزل الموسيقى
            * **عزل دقيق واحترافي:** تفعيل وتطبيق فلاتر عزل الموسيقى والآلات الموسيقية بشكل أدق للحصول على صوت بشري فائق النقاء وخالٍ من العيوب.
            * **قوائم التشغيل الصوتية:** أصبح الآن بالإمكان تنزيل قوائم التشغيل كاملة كملفات صوتية فقط بكفاءة عالية، مع ضمان تطبيق إعدادات عزل الموسيقى والترجمات على كامل القائمة بنجاح.

            ### 🇬🇧 What's New in v3.3.0:
            * **Unrestricted Resolutions:** Fixed the 360p lock issue, unlocking all available formats up to 4K with guaranteed audio merging.
            * **Subtitle Engine Overhaul:** Eliminated duplicate subtitle downloads and fixed embedding/auto-caption issues for a seamless experience.
            * **Flawless Audio & Playlists:** Improved vocal isolation precision and completely fixed audio-only and subtitle downloads for entire playlists.