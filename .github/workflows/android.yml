name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 platforms;android-34 build-tools;34.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          echo "Setting up permanent signing configuration..."
          if [ ! -f "keystore.properties" ]; then
            cat <<EOF > keystore.properties
          keyAlias=vdownloader
          keyPassword=vdownloader_keystore_pass_2026
          storeFile=../signing/release.jks
          storePassword=vdownloader_keystore_pass_2026
          EOF
          fi

      - name: Build Release APKs
        run: ./gradlew --no-daemon assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Extract App Version dynamically from Version.kt
      - name: Extract App Version
        run: |
          MAJOR=$(grep -oE 'versionMajor\s*=\s*[0-9]+' buildSrc/src/main/kotlin/Version.kt | grep -oE '[0-9]+')
          MINOR=$(grep -oE 'versionMinor\s*=\s*[0-9]+' buildSrc/src/main/kotlin/Version.kt | grep -oE '[0-9]+')
          PATCH=$(grep -oE 'versionPatch\s*=\s*[0-9]+' buildSrc/src/main/kotlin/Version.kt | grep -oE '[0-9]+')
          APP_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "Extracted App Version: $APP_VERSION"

      # Prune previous GitHub releases
      - name: Delete Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning older releases from GitHub..."
          gh release list --limit 1000 --json tagName -q '.[].tagName' 2>/dev/null | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting release for tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            fi
          done || true

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-Downloader ${{ env.APP_VERSION }} — التحديث الشامل والإصلاحات الدقيقة
          tag_name: ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🚀 V-Downloader ${{ env.APP_VERSION }} — تطوير متقدم للتكامل المحلي و UI & UX وهندسة المحرك

            > ⚡ **إصدار ${{ env.APP_VERSION }} مع تطوير متقدم للتكامل مع نظام أندرويد، تحسينات UI & UX التفاعلية، ومعالجة أدق للشبكة والوسائط والترجمات.**

            ---

            ### ✨ أبرز التحسينات والتطويرات في هذا الإصدار:

            * 📱 **التكامل المحلي مع النظام والأجهزة (Android OS Integration)**:
              - إصلاح قراءة الحافظة على Android 10+ في `QuickDownloadActivity` (القراءة الآمنة بعد `onWindowFocusChanged` + الإبقاء على شاشة إدخال الرابط بدل الإغلاق الفوري عند خلو الحافظة).
              - تفعيل `QuickDownloadActivity` واختصارات المشغّل الديناميكية (`ShortcutManagerCompat`) وتوسيع استعلامات `<queries>` للتعامل السلس مع الروابط والمشغلات ومديري الملفات.
              - دعم إبقاء الشاشة نشطة (`keepScreenOn`) وتكامل التركيز الصوتي (`AudioAttributes` مع `handleAudioFocus`) ووضع صورة داخل صورة (**PiP** على Android 8+) والتدوير السلس (`screenSize|screenLayout`) في المشغل المدمج.
              - تطبيق قيد الشبكة المقاسة (`CELLULAR_DOWNLOAD`) فعلياً داخل `DownloadQueueManager` مع إيقاف مؤقت عند الانتقال لبيانات الهاتف واستئناف تلقائي فوري عند عودة شبكة Wi-Fi، وربط `PlaylistSyncWorker` للمزامنة الدورية في الخلفية عبر Wi-Fi.
            * 🔔 **الإشعارات وإصلاحات التخزين المحدود (SAF)**:
              - إضافة إجراء **الإيقاف المؤقت / الاستئناف** مباشرة من إشعارات التقدم والخطأ مع تخصيص `requestCode` مميز ومنع ثبات بيانات `FLAG_ONE_SHOT` القديمة.
              - إصلاح استخراج الأسماء والأحجام لمسارات `content://` (`DocumentFile`) والاكتشاف التلقائي لملفات الترجمة المجاورة (`.srt` / `.vtt` / `.ass`).
            * 🎛️ **تطوير متقدم للواجهات و UI & UX والمحرر المدمج**:
              - بطاقة اكتشاف الروابط الذكية من الحافظة وتنبيه الانتظار لشبكة Wi-Fi في شاشة قائمة الانتظار، وشارة العدد النشط في قائمة التنقل.
              - تحويل `VideoListPage` إلى شبكة متجاوبة ذات عمودين على الشاشات العريضة (`LazyVerticalGrid`) وإضافة أدوات **القص السريع** والفتح بمشغل خارجي في تفاصيل العنصر.
              - ترقية `MediaPlaybackScreen` (السرعة، تغيير نسبة العرض، الترجمات، الشريط العائم، ومعالجة الأخطاء) و`MediaTrimmerDialog` (قراءة المدة الفعلية بـ `MediaMetadataRetriever` وشريط `RangeSlider` تفاعلي وقوالب سريعة) و`SubtitleAdjustDialog` (معاينة حية لتوقيت الترجمة وحفظ نسخة `_synced`).
              - بطاقة فحص صحة التخزين والمساحة المتاحة وتنظيف الملفات العالقة بشكل غير متزامن في إعدادات المجلد، وتوحيد التعريب الكامل بالعربية والإنجليزية.

            ---

            ### 📦 ملفات التثبيت (Assets):
            * `V-Downloader-arm64-v8a-release.apk` — للأجهزة الحديثة (64-bit).
            * `V-Downloader-armeabi-v7a-release.apk` — للأجهزة الأقدم (32-bit).
            * `V-Downloader-universal-release.apk` — النسخة الشاملة لكافة الأجهزة.

            ---
            *صُنِع بكل شغف لتقديم أفضل وأقوى تجربة تنزيل وسائط للأندرويد.* ❤️