name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          echo "Setting up permanent signing configuration..."
          if [ ! -f "keystore.properties" ]; then
            cat <<EOF > keystore.properties
          keyAlias=vdownloader
          keyPassword=vdownloader_keystore_pass_2026
          storeFile=../signing/release.jks
          storePassword=vdownloader_keystore_pass_2026
          EOF
          fi

      - name: Build Release APKs
        run: ./gradlew --no-daemon assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Prune previous GitHub releases
      - name: Delete Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning older releases from GitHub..."
          gh release list --limit 1000 --json tagName -q '.[].tagName' 2>/dev/null | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting release for tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            fi
          done || true

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-Downloader v3.6.18 - إظهار كافة الترجمات المتاحة، مزامنة الإعداد المسبق، وتسمية مجلد ترجمات القوائم [Subtitles]
          tag_name: v3.6.18
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🚀 V-Downloader v3.6.18 — الإصدار الذهبي المكتمل (Ultimate Stable Release)

            > 💎 **تحديث شامل يعالج إظهار كافة الترجمات المتوفرة (العربية، الإنجليزية، والتلقائية)، مزامنة بطاقة الإعداد المسبق مع تفضيلات الإعدادات، وحفظ ترجمات قوائم التشغيل داخل مجلد مخصص يحمل وسم [Subtitles] واسم القائمة.**

            ---

            ### 🌟 سجل التحديثات والإصلاحات الشامل (5 أغسطس — 26 أغسطس):

            #### 🎬 1. الفصل التام للمقاطع الفردية عن قوائم التشغيل (Single vs Playlist Separation)
            * **إلغاء المجلدات الفرعية للمقاطع المفردة**: حل نهائي يمنع إنشاء مجلدات لقوائم التشغيل عند تنزيل مقطع فيديو مفرد حتى لو احتوى الرابط على معرّف قائمة `&list=` أو توفرت بيانات قائمة في وصف المقطع.
            * **إلغاء ترقيم المقاطع المفردة**: منع إضافة بادئة الأرقام (`001 -` أو `NA -`) للمقاطع المفردة، وحفظها باسمها الأصلي النظيف مباشرة في مجلد التنزيل الرئيسي.

            #### 📝 2. الدمج الاحترافي للترجمات داخل الفيديو (`--embed-subs`)
            * **دعم دمج الترجمة الفوري**: إصلاح تمرير تفضيل دمج الترجمة من واجهة تخصيص التنسيق (`Format Selection`) لضمان دمج ملفات الترجمة المختارة أو التلقائية داخل الفيديو بنقرة زر واحدة.
            * **توافق كامل مع حاويات MP4 و MKV**: دمج الترجمات بسلاسة مع دعم نصوص `mov_text` لحاويات MP4 ونصوص `SRT/ASS/VTT` لحاويات MKV.
            * **تحميل الترجمات الفردية**: استقرار تام لتحميل ملفات الترجمة المستقلة بصيغ متعددة دون أي تعليق.

            #### 🔄 3. الترقية النظيفة وتجاوز مشاكل الإصدارات القديمة (Upgrade Migration Engine)
            * **مسح الكاش والمخلفات التالفة**: محرك ترقية تلقائي يقوم فور تثبيت التحديث بمسح الكاش الداخلي القديم لـ yt-dlp ومسح الملفات المؤقتة وأقفال التنزيل (`.part`, `.aria2`, `sub_temp_*`).
            * **إعادة استخراج المحركات الثنائية**: إعادة تهيئة حزم Python و FFmpeg المدمجة تلقائياً لتفادي أي أخطاء موروثة من التثبيتات السابقة.
            * **تصحيح الإعدادات التالفة**: معالجة تلقائية لأي مفاتيح إعدادات أو مسارات تخزين معطوبة لضمان عمل التطبيق كأنه مثبت للمرة الأولى.

            #### 📂 4. التنظيم الذكي لمجلدات قوائم التشغيل (Playlist Subdirectory Engine)
            * **مجلد مخصص باسم قائمة التشغيل**: حفظ كافة عناصر القائمة (فيديو، صوت، ترجمات) داخل مجلد يحمل **الاسم الحقيقي لقائمة التشغيل** تلقائياً.
            * **دعم الدقة العالية لملفات الفيديو والصوت**: توجيه ذكي لمسارات الحفظ `-P` لضمان تنزيل الفيديوهات والصوتيات بأعلى جودة مع مساراتها الصحيحة دون فقدان.
            * **زر فتح المجلد المباشر**: إمكانية فتح المجلد الفعلي لقائمة التشغيل فوراً من بطاقة القائمة الموحدة.

            #### ⚡ 5. القضاء التام على فشل التنزيل الوهمي (Zero False-Negative Engine)
            * **حل مشكلة "الملف محمل لكن يعطي فشل"**: تحسين `SubtitleDownloader` و`PostDownloadCoordinator` لاكتشاف وتسجيل الملفات المكتملة فوراً وتجاوز فروقات التسمية ورموز UTF-8 BOM وتنسيقات RTL العربية.
            * **الاسترداد التلقائي للملفات**: فحص المجلد الوجهة قبل وبعد التنزيل؛ إذا وُجد الملف سليماً يتم اعتماده فوراً بنجاح 100% دون إظهار أي رسالة خطأ.

            #### 🎥 6. محرك المعاينة وتشغيل الوسائط المطور (Media & Subtitle Preview Engine)
            * **واجهة عصرية بتصميم Material 3**: تحسين شامل لتجربة المستخدم (UI & UX) وتجاوب الشاشة مع كافة الأبعاد (Shorts 9:16 والفيديوهات 16:9).
            * **قارئ الترجمات المدمج**: وضع خاص لعرض نصوص ملفات الترجمة (`.srt`، `.vtt`، `.ass`، `.lrc`) مع التوقيت والبحث اللحظي داخل النص.
            * **التحكم بالسرعة والمشغل الخارجي**: تغيير سرعة التشغيل من (0.5x إلى 2.0x) وزر مخصص للفتح المباشر في أي مشغل خارجي مثبت (VLC، MX Player، وغيرها).
            * **حل مشكلة فتح الملف المحمل**: إصلاح `FileProvider` و`provider_paths.xml` وتوفير وصول آمن لكافة مسارات التخزين دون أخطاء أمنية.

            #### 🌐 7. المطابقة الذكية للغات والترجمات المخصصة
            * **تحديد لغات الترجمة بدقة**: حل مشكلة إعادة رسالة "لم تختر اللغة" عند اختيار تخصيص التنسيق عبر محرك `LanguageMatcher`.
            * **دعم اللهجات والوسوم البديلة**: مطابقة تلقائية للغة العربية بكافة أشكالها (`ar`, `ar-SA`, `ar-EG`, `ar-orig`) والتعبيرات النمطية.

            #### 🛡️ 8. إدارة الأذونات الصارمة (Scoped Storage & Permissions)
            * **فحص حقيقي وصارم للأذونات**: التوقف عن إعطاء إذن التخزين الممنوح وهمياً قبل طلبه؛ حيث يتم الآن التحقق الفعلي من صلاحيات نظام Android 13+ (`READ_MEDIA_*`) وAndroid 11+ (`MANAGE_EXTERNAL_STORAGE`).
            * **توجيه مباشر لإعدادات النظام**: النقر على زر الإذن يفتح الشاشة المخصصة مباشرة.

            #### 🎼 9. محرك عزل الموسيقى المتقدم (Hammil / BS-RoFormer Vocal Isolation)
            * استقرار كامل لمحرك عزل الصوت والموسيقى بدقة احترافية ومكتبات معالجة عالية الأداء.

            ---

            ### 📦 ملفات التثبيت المتاحة (Download Assets):
            * `V-Downloader-arm64-v8a-release.apk` — للأجهزة الحديثة بمعمارية 64-bit (موصى به لمعظم الهواتف).
            * `V-Downloader-armeabi-v7a-release.apk` — للأجهزة الأقدم بمعمارية 32-bit.
            * `V-Downloader-universal-release.apk` — نسخة شاملة متوافقة مع جميع الأجهزة والمعالجات.

            ---
            *صُنِع بكل شغف لتقديم أفضل وأقوى تجربة تنزيل وسائط للأندرويد.* ❤️