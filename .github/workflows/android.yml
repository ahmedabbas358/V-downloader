name: Build & Release V-Downloader APKs

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vdownloader-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle


      - name: Setup Android
        uses: android-actions/setup-android@v3


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      - name: Make gradlew executable
        run: chmod +x gradlew


      - name: Create signing files
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

          printf "storeFile=release.keystore\n" > keystore.properties
          printf "keyAlias=%s\n" "$KEY_ALIAS" >> keystore.properties
          printf "keyPassword=%s\n" "$KEY_PASSWORD" >> keystore.properties
          printf "storePassword=%s\n" "$STORE_PASSWORD" >> keystore.properties


      - name: Build Release
        run: |
          ./gradlew assembleGenericRelease \
          --no-daemon \
          --stacktrace


      - name: Find APK
        run: |
          find app/build/outputs/apk -name "*.apk"


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-release
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error


      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk