name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          echo "Setting up permanent signing configuration..."
          if [ ! -f "keystore.properties" ]; then
            cat <<EOF > keystore.properties
          keyAlias=vdownloader
          keyPassword=vdownloader_keystore_pass_2026
          storeFile=../signing/release.jks
          storePassword=vdownloader_keystore_pass_2026
          EOF
          fi

      - name: Build Release APKs
        run: ./gradlew --no-daemon assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Prune previous GitHub releases
      - name: Delete Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning older releases from GitHub..."
          gh release list --limit 1000 --json tagName -q '.[].tagName' 2>/dev/null | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting release for tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            fi
          done || true

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-Downloader v3.6.21 - الإصلاح الدقيق والشامل لواجهة التنسيقات المخصصة، الستارة، سرعة التواصل، دمج الترجمات، ومحرك القوائم
          tag_name: v3.6.21
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🚀 V-Downloader v3.6.21 — التحديث الدقيق والشامل (Comprehensive Stability & Performance Update)

            > 💎 **تحديث رئيسي يعالج المشاكل السبعة الأساسية بدقة متناهية: يضمن ظهور نافذة اختيار التنسيقات المخصصة، يمنع تعليق الستارة وتجمد التطبيق، يسرع جلب وسائط التواصل الاجتماعي، يثبت دمج الترجمات ويمنع حذفها، يضبط فتح الملفات ومجلداتها، ويقضي على المقاطع الوهمية في فاحص القوائم.**

            ---

            ### 🌟 تفاصيل الإصلاحات والتحسينات في الإصدار v3.6.21:

            #### 🎨 1. إصلاح واجهة اختيار التنسيقات المخصصة (Custom Formats Sheet)
            * **الترقية إلى Material 3 ModalBottomSheet**: ظهور فوري وسلس لنافذة التنسيقات المخصصة دون اختفاء أو تعليق.
            * **دعم الروابط المباشرة ووسائل التواصل**: توليد تنسيق افتراضي ذكي (Default/Best) في حال عدم وجود قائمة تنسيقات متعددة لمنع الإغلاق الصامت.

            #### ⚡ 2. حل مشكلة تعليق الستارة السفلية والتنزيل التلقائي (Preset Download)
            * **إغلاق الستارة فوراً**: إغلاق الستارة السفلية في جزء من الثانية بمجرد الضغط على زر التنزيل التلقائي ودون تعليق في حالة التحميل.
            * **الفصل التام للمقاطع الفردية**: منع فحص قائمة التشغيل كاملة عند اختيار تنزيل مقطع فردي يحوي الرابط على معيار `list=`.

            #### 🚀 3. القضاء على تعليق وتجمد التطبيق (ANR / UI Freeze Elimination)
            * **معالجة غير متزامنة بالكامل**: نقل كافة عمليات جلب البيانات والفحص إلى `Dispatchers.IO` في الخلفية مع تحديث آمن وسلس للواجهة.
            * **مهل شبكة ذكية وسريعة**: تقليل مهلة اتصال جلب البيانات الوصفية لمنع الانتظار الطويل.

            #### 📱 4. تسريع جلب مقاطع وسائل التواصل الاجتماعي (Social Media Extraction)
            * **تنظيف وسائط الاستخراج**: إزالة وسائط استخراج TikTok و Instagram القديمة المعطلة التي كانت تتسبب في بطء الاستدعاءات.
            * **تمرير `--no-playlist` و `--dump-single-json`**: جلب فوري لبيانات المقاطع الفردية في 1-3 ثوانٍ.

            #### 📝 5. استقرار دمج الترجمات وتوافق الحاويات (Subtitle Embedding)
            * **منع حذف ملفات الترجمة**: إزالة `--compat-options no-keep-subs` لضمان حفظ الترجمة حتى في حال تعثر الدمج.
            * **دعم كافة اللغات**: توسيع استخراج الترجمات لكافة اللغات المتاحة (`all`).
            * **تحويل تلقائي متوافق**: ضبط صيغ الترجمة لتتوافق بدقة مع MP4 (`mov_text/srt`) و MKV (`ass/srt`).

            #### 📂 6. فتح الملف والمجلد في مكانه الحقيقي (File & Directory Opening)
            * **منح أذونات FileProvider الصريحة**: تمرير `clipData` في Intent لتمكين المشغلات الخارجية (VLC, MX Player) من تشغيل الملف مباشرة.
            * **دعم كامل لمسارات SAF**: فتح المجلد الفعلي المباشر دون الارتداد لمجلد التنزيلات العام.

            #### 🔍 7. إصلاح محرك فحص القوائم (PlaylistVerifier)
            * **القضاء على الـ 3 مقاطع الوهمية**: إزالة شرط المطابقة غير المشروط وتأكيد تطابق اسم الفيديو الفعلي أو المعرف `videoId`.
            * **عزل مجلدات الفحص**: منع مطابقة ملفات عشوائية من مجلد التنزيلات العام كعناصر من القائمة.

            ---

            ### 📦 ملفات التثبيت المتاحة (Download Assets):
            * `V-Downloader-arm64-v8a-release.apk` — للأجهزة الحديثة بمعمارية 64-bit (موصى به).
            * `V-Downloader-armeabi-v7a-release.apk` — للأجهزة بمعمارية 32-bit.
            * `V-Downloader-universal-release.apk` — نسخة شاملة لجميع الأجهزة.

            ---
            *صُنِع بكل شغف لتقديم أفضل وأقوى تجربة تنزيل وسائط للأندرويد.* ❤️