name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          echo "Setting up permanent signing configuration..."
          if [ ! -f "keystore.properties" ]; then
            cat <<EOF > keystore.properties
          keyAlias=vdownloader
          keyPassword=vdownloader_keystore_pass_2026
          storeFile=../signing/release.jks
          storePassword=vdownloader_keystore_pass_2026
          EOF
          fi

      - name: Build Release APKs
        run: ./gradlew --no-daemon assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Prune previous GitHub releases
      - name: Delete Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning older releases from GitHub..."
          gh release list --limit 1000 --json tagName -q '.[].tagName' 2>/dev/null | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting release for tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            fi
          done || true

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-Downloader v3.6.21 - التحديث الشامل للاستقرار والتنظيم الفائق، واجهة التنسيقات المخصصة، ودمج الترجمات
          tag_name: v3.6.21
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🚀 V-Downloader v3.6.21 — التحديث الشامل للاستقرار والتنظيم الفائق (Ultimate Precision & Stability Update)

            > 💎 **تحديث رئيسي يحل مشاكل تنظيم مجلدات ترجمات قوائم التشغيل بشكل منفصل [Subtitles]، يضمن فتح المجلد والملف الفعلي المباشر، يثبت دمج الترجمات داخل الفيديو، يعيد بناء محرك فحص واستئناف التنزيلات الناقصة بدقة 100%، ويصلح ظهور نافذة التنسيقات المخصصة والستارة وسرعة الوسائط.**

            ---

            ### 🌟 أبرز التحسينات والإصلاحات الشاملة في الإصدار v3.6.21:

            #### 🎨 1. إصلاح واجهة التنسيقات المخصصة (Custom Formats Sheet)
            * **انبثاق فوري وسلس**: ترقية نافذة اختيار التنسيقات إلى Material 3 ModalBottomSheet لضمان ظهورها الفوري عند اختيار "مخصص" دون اختفاء أو تعليق.
            * **دعم الروابط الفردية**: توليد تنسيق افتراضي ذكي (Default/Best) لمقاطع وسائل التواصل والروابط المباشرة لمنع الإغلاق الصامت.

            #### 📂 2. مجلد منفصل وحصري لترجمات كل قائمة تشغيل (`[Subtitles] <اسم القائمة>`)
            * **عزل كامل لترجمات القوائم**: يتم الآن حفظ ملفات ترجمات كل قائمة تشغيل داخل مجلد فرعي مستقل يحمل اسم `[Subtitles] <اسم القائمة>` مع استخراج معرّف القائمة `listId` حتى لو كان الرابط بصيغة مشاركة مقطع `watch?v=...&list=...`.
            * **منع الحفظ في الفولدر العام**: القضاء التام على تسرب ملفات الترجمة إلى المجلد الجذري العام عند اختيار تنزيل ترجمات القائمة فقط.

            #### 🔍 3. الانتقال المباشر والدقيق لمجلد وملف الوسائط المكتملة
            * **فتح الملف في المشغل المفضل**: تمرير أذونات قراءة الـ URI الصريحة عبر `clipData` لتمكين المشغلات الخارجية (VLC, MX Player) من فتح الفيديو مباشرة دون خطأ المسار.
            * **فتح المجلد الحقيقي فوراً**: زر فتح المجلد يقودك مباشرة إلى المجلد الفعلي الذي تم حفظ الملف داخله بالاعتماد على مسار التنزيل الحقيقي ومسارات SAF و Content URIs دون الارتداد للمجلد العام.

            #### 📝 4. استقرار دمج الترجمات داخل الفيديو (`--embed-subs`)
            * **معالجة متقدمة لقواعد الحاويات (MP4 vs MKV)**: التمييز التلقائي بين حاويات MP4 التي تتطلب نصوص `mov_text` بدون تحويلات خارجية، وبين حاويات MKV الداعمة لـ `SRT/ASS/VTT` لمنع انهيار المعالجة.
            * **منع حذف ملفات الترجمة**: إزالة خيار الحذف الإجباري `no-keep-subs` لحفظ الترجمة حتى في حال تعثر الدمج، مع استخراج كافة اللغات المتاحة (`all`).

            #### 🔄 5. إعادة بناء محرك فحص واستئناف الناقص (`Playlist Sync & Audit Engine`)
            * **القضاء على مطابقة المقاطع الـ 3 الوهمية**: إزالة شرط المطابقة غير المشروط وتأكيد تطابق اسم الفيديو الفعلي (نسبة الكلمات >= 50%) أو المعرف `videoId`.
            * **حل مشكلة النقطة في الأسماء وفحص المجلدات**: البحث الذكي عن الملفات داخل مجلدات القوائم الفرعية مع التعرف الأوتوماتيكي على الملفات المحملة بنسبة 100% حتى لو تم اقتطاع أسمائها من قِبل yt-dlp.

            #### ⚡ 6. إنهاء تعليق الستارة السفلية وتجمد التطبيق (No Bottom Sheet Hang & No ANR)
            * **إغلاق الستارة فوراً**: إغلاق الستارة السفلية في أجزاء من الثانية بمجرد بدء التنزيل التلقائي مع استمرار المعالجة في الخلفية.
            * **سرعة فائقة لمقاطع التواصل الاجتماعي**: إزالة وسائط استخراج TikTok و Instagram المعطلة لتسريع جلب المقاطع، ونقل كافة عمليات الفحص للعمل على `Dispatchers.IO` لمنع تجمد التطبيق نهائياً.

            ---

            ### 📦 ملفات التثبيت المتاحة (Download Assets):
            * `V-Downloader-arm64-v8a-release.apk` — للأجهزة الحديثة بمعمارية 64-bit (موصى به لمعظم الهواتف).
            * `V-Downloader-armeabi-v7a-release.apk` — للأجهزة الأقدم بمعمارية 32-bit.
            * `V-Downloader-universal-release.apk` — نسخة شاملة متوافقة مع جميع الأجهزة والمعالجات.

            ---
            *صُنِع بكل شغف لتقديم أفضل وأقوى تجربة تنزيل وسائط للأندرويد.* ❤️