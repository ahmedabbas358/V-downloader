name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          echo "Setting up permanent signing configuration..."
          if [ ! -f "keystore.properties" ]; then
            cat <<EOF > keystore.properties
          keyAlias=vdownloader
          keyPassword=vdownloader_keystore_pass_2026
          storeFile=../signing/release.jks
          storePassword=vdownloader_keystore_pass_2026
          EOF
          fi

      - name: Build Release APKs
        run: ./gradlew --no-daemon assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Prune previous GitHub releases
      - name: Delete Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning older releases from GitHub..."
          gh release list --limit 1000 --json tagName -q '.[].tagName' 2>/dev/null | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting release for tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            fi
          done || true

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-Downloader v3.6.5 - منع تكرار الترجمات، مجلدات [Subtitle] للقوائم، والترقيم الدقيق
          tag_name: v3.6.5
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🌟 V-Downloader v3.6.5 - الإصدار الرسمي المستقر

            > 🚀 **تحديث حاسم يمنع تكرار تنزيل ملفات الترجمة نهائياً، وينشئ مجلد قائمة تشغيل الترجمات بالاسم الدقيق `[Subtitle] Playlist Title`، ويطبق الترقيم التتابعي `001 - ...` لكافة الملفات بدقة كاملة.**

            ---

            ### 🔥 أبرز ما تم إنجازه في إصدار v3.6.5:

            #### 🛑 1. منع تكرار ملفات الترجمة نهائياً (`Deduplication`)
            * **اختيار ملف واحد فقط لكل لغة مطلوبة**: فلترة واستبعاد التكرارات الناتجة عن اللغات التلقائية والمشتقة (مثل `ar-orig` و `ar-ar`)، واختيار أفضل ملف ترجمة نقي وحيد لكل لغة اختارها المستخدم.
            * **إزالة الملفات المؤقتة فورياً**: منع حفظ ملفات متعددة لنفس المقطع.

            #### 📁 2. تسمية مجلد قائمة الترجمة بدقة `[Subtitle] Playlist Title`
            * إنشاء مجلد قائمة التشغيل على القرص دائماً بالصيغة القياسية المطلوبة مع كلمة `[Subtitle]` قبل عنوان القائمة.
            * زر فتح المجلد يفتح مباشرة مجلد `[Subtitle] <اسم القائمة>` في مدير الملفات.

            #### 🔢 3. الالتزام بالترقيم التتابعي للمقاطع (`001 - ...`)
            * تطبيق الترقيم التتابعي المكون من 3 خانات بدقة عند تفعيل خيار ترقيم القائمة، مع تنقية اسم المقطع من أي بادئات زائدة.

            #### ⚙️ 4. التكامل الكامل مع واجهة التخصيص والإعداد المسبق
            * ربط كافة خيارات الترجمة وتنسيقات `SRT, VTT, ASS, LRC` والترجمة التلقائية بين شاشة الضبط والتحميل المباشر.
