name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          echo "Setting up permanent signing configuration..."
          if [ ! -f "keystore.properties" ]; then
            cat <<EOF > keystore.properties
          keyAlias=vdownloader
          keyPassword=vdownloader_keystore_pass_2026
          storeFile=../signing/release.jks
          storePassword=vdownloader_keystore_pass_2026
          EOF
          fi

      - name: Build Release APKs
        run: ./gradlew --no-daemon clean assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Prune previous GitHub releases
      - name: Delete Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning older releases from GitHub..."
          gh release list --limit 1000 --json tagName -q '.[].tagName' 2>/dev/null | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting release for tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            fi
          done || true

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-Downloader v3.5.6 - دقة التحقق من العناصر المفقودة لقوائم التشغيل
          tag_name: v3.5.6
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🌟 V-Downloader v3.5.6 - دقة متناهية في فحص قوائم التشغيل

            > 🎯 **إصلاح أخطاء التعرف على العناصر المفقودة + القضاء التام على التطابقات الخاطئة (False Positives)**

            ---

            ### 🔥 أبرز ما تم إصلاحه وتطويره في هذا الإصدار:

            #### 🔍 1. القضاء على التطابقات الخاطئة في فحص قوائم التشغيل
            * **إلغاء التطابق بالكلمات المتشابهة:** تم إزالة التطابق الفضفاض بالكلمات المشتركة لاسم السلسلة الذي كان يتسبب في احتساب مقاطع مفقودة على أنها موجودة (مثل احتساب 45 بدلاً من 42).
            * **مطابقة قطعية حصرية:** المطابقة تتم الآن حصرياً عبر:
              1. معرّف الفيديو الفريد (Video ID) بدقة 100%.
              2. ترقيم بداية الملف الصارم (`001 - `, `042 - `) مع التحقق من تطابق العنوان.
              3. التطابق التام للاسم أو تشابه ليفنشتاين (Levenshtein Similarity >= 88%).
            * **إصلاح خطأ `contains` في `FileCollisionResolver`:** منع تطابق العناوين القصيرة (مثل Episode 4) كجزء من عناوين أخرى (مثل Episode 42).

            #### 🎬 2. استقرار التنزيل وعزل الموسيقى
            * استعادة كافة الجودات والصوتيات بدون قيود.
            * تنزيل تسلسلي هادئ للترجمات لمنع حظر 429.
            * عزل جذري للترددات الموسيقية والآلات.