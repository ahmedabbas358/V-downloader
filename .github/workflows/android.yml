name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          echo "Setting up permanent signing configuration..."
          if [ ! -f "keystore.properties" ]; then
            cat <<EOF > keystore.properties
          keyAlias=vdownloader
          keyPassword=vdownloader_keystore_pass_2026
          storeFile=../signing/release.jks
          storePassword=vdownloader_keystore_pass_2026
          EOF
          fi

      - name: Build Release APKs
        run: ./gradlew --no-daemon clean assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Prune previous GitHub releases
      - name: Delete Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning older releases from GitHub..."
          gh release list --limit 1000 --json tagName -q '.[].tagName' 2>/dev/null | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting release for tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            fi
          done || true

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-Downloader v3.5.5 - استعادة كافة الجودات وعزل الموسيقى الجذري
          tag_name: v3.5.5
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🌟 V-Downloader v3.5.5 - التحديث الشامل النهائي

            > 🚀 **استعادة كافة جودات يوتيوب (4K, 1080p, 720p, صوتيات) + عزل موسيقى جذري + تنظيم الترجمات وقوائم التشغيل**

            ---

            ### 🔥 أبرز ما تم إصلاحه وتطويره في هذا الإصدار:

            #### 🎬 1. استعادة جميع جودات يوتيوب والصوتيات المنفصلة
            * **إلغاء حصر المشغّل:** إزالة `--extractor-args` الإجبارية التي كانت تحصر يوتيوب في مشغل iOS منخفض الجودة (360p فقط) وتمنع ظهور مسارات الصوتيات (Opus / M4A) وجودات 1080p و 4K.
            * **استعادة كامل الجودات:** يوتيوب يعرض الآن جميع الجودات المتاحة تلقائيًا (4K, 1440p, 1080p, 720p, 480p, 360p) مع كامل مسارات الصوت.

            #### 📝 2. إصلاح ترجمات قوائم التشغيل والعناصر المفقودة
            * **تسمية صحيحة ودقيقة:** إصلاح خطأ تسمية ملفات الترجمة باسم اللغة (مثل Arabic.ar.srt)؛ الآن تُحفظ بأسماء المقاطع الفعلية مع الترقيم التلقائي (مثل `001 - عنوان المقطع.ar.srt`).
            * **تنزيل تسلسلي صارم (Concurrency = 1):** تنزيل الترجمات لقوائم التشغيل يتم بمعدل ملف واحد في كل مرة مع تأخير ذكي (Pacing Delay) لمنع حظر يوتيوب وأخطاء 429 Too Many Requests.
            * **منع تكرار المجلدات:** حل مشكلة إنشاء مجلدات متداخلة عند استكمال العناصر المفقودة.

            #### 🎙️ 3. محرك عزل الموسيقى الجذري المطور (Deep DSP Separation)
            * **حذف تسريب الصوت الأصلي:** تم إزالة إعادة مزج الصوت الأصلي التي كانت تُعيد إدخال الموسيقى للمقطع.
            * **كتم عميق للآلات والطبول:** عزل الترددات المنخفضة (< 120Hz) والعالية (> 4800Hz) مع خفض خلفيات الآلات بمقدار (-34dB إلى -46dB).
            * **حماية وتعزيز مخارج الحروف:** تعزيز الترددات التوافقية للصوت البشري والكلام فقط.
            * **تنفيذ إجباري عند الطلب:** تفعيل العزل دائماً عند تفعيل خيار إزالة الموسيقى دون تخطي.