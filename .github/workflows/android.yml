name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          echo "Setting up permanent signing configuration..."
          if [ ! -f "keystore.properties" ]; then
            cat <<EOF > keystore.properties
          keyAlias=vdownloader
          keyPassword=vdownloader_keystore_pass_2026
          storeFile=../signing/release.jks
          storePassword=vdownloader_keystore_pass_2026
          EOF
          fi

      - name: Build Release APKs
        run: ./gradlew --no-daemon assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Prune previous GitHub releases
      - name: Delete Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning older releases from GitHub..."
          gh release list --limit 1000 --json tagName -q '.[].tagName' 2>/dev/null | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting release for tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            fi
          done || true

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-Downloader v3.6.7 - حل شامل لتحميل مقاطع انستغرام ووسائل التواصل
          tag_name: v3.6.7
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🌟 V-Downloader v3.6.7 - الإصدار الرسمي المستقر

            > 🚀 **حل شامل وجذري لمشاكل استخراج وتنزيل مقاطع الفيديو من انستغرام (Instagram Reels/Posts/Stories) وكافة منصات التواصل الاجتماعي (TikTok, Facebook, Twitter/X, Threads, YouTube Shorts).**

            ---

            ### 🔥 أبرز ما تم إنجازه في إصدار v3.6.7:

            #### 📸 1. حل جذري وشامل لتحميل مقاطع انستغرام (Instagram)
            * **معالجة وتنقية الروابط تلقائياً (`SocialMediaUrlNormalizer`)**: إزالة كافة وسوم التتبع التلقائي (`igsh`, `utm_*`, `si`, `xmt` وغيرها) التي كانت تتسبب في تلف الروابط ورفضها من المحرك.
            * **تصحيح مسارات المشاركة (`/share/reel/`, `/share/p/`, `/reels/`)**: تحويل كافة روابط المشاركة المنسوخة من تطبيق انستغرام إلى مسارات قياسية مدعومة أصلياً.
            * **حقن ترويسات متصفحات حديثة (`Modern Browser User-Agent & Headers`)**: تجاوز جدار الحظر والحماية وطلب تسجيل الدخول (`Rate-limit reached or login required / 401 Unauthorized`) عبر إرسال ترويسات متصفح كاملة.
            * **تفكيك منشورات ومقاطع انستغرام متعددة الوسائط (`Reels & Multi-item Post Unwrapping`)**: فك التغليف التلقائي لحزم الوسائط واستخراج مسارات البث وصيغ الفيديو والصوت مباشرة.

            #### 🌐 2. دعم فائق لمنصات التواصل الاجتماعي (TikTok, Facebook, Twitter/X, Threads, YouTube)
            * **Twitter / X Syndication API**: تحميل مقاطع منصة إكس وتويتر بدون الحاجة لمفاتيح API أو تسجيل دخول.
            * **TikTok Shortlinks & Metadata**: تنقية روابط تيك توك المختصرة وتحميل المقاطع بأعلى جودة متوفرة.
            * **Facebook Reels & Watch**: دعم روابط المشاركة السريعة `fb.watch` و `facebook.com/share/r/`.
            * **محدد الجودة الشامل (`Format Fallback`)**: ضمان الانتقال التلقائي لأفضل جودة متوفرة (`/best`) دون توقف التنزيل بسبب اختلاف أبعاد المقاطع الرأسية.

            #### 🔄 3. التحديث التلقائي لمحرك التنزيل (Auto yt-dlp Updates)
            * تفعيل فحص وتحديث محرك `yt-dlp` دورياً في الخلفية لضمان مواكبة أحدث التغييرات البرمجية في منصات التواصل الاجتماعي.
            * الحفظ التلقائي والفوري لملفات تعريف الارتباط (`Cookies`) بعد تسجيل الدخول من المتصفح الداخلي.

