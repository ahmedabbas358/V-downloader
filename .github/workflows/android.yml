name: Build & Release V-Downloader APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          echo "Setting up permanent signing configuration..."
          if [ ! -f "keystore.properties" ]; then
            cat <<EOF > keystore.properties
          keyAlias=vdownloader
          keyPassword=vdownloader_keystore_pass_2026
          storeFile=../signing/release.jks
          storePassword=vdownloader_keystore_pass_2026
          EOF
          fi

      - name: Build Release APKs
        run: ./gradlew --no-daemon assembleGenericRelease --stacktrace

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f -name "*.apk"

      # ARM64
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-arm64-v8a
          path: app/build/outputs/apk/generic/release/*arm64-v8a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # ARMv7
      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*armeabi-v7a*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Universal
      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Downloader-universal
          path: app/build/outputs/apk/generic/release/*universal*.apk
          if-no-files-found: ignore
          retention-days: 20

      # Prune previous GitHub releases
      - name: Delete Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning older releases from GitHub..."
          gh release list --limit 1000 --json tagName -q '.[].tagName' 2>/dev/null | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting release for tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            fi
          done || true

      # GitHub Release creation & APK publishing
      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/generic/release/*.apk
          name: V-Downloader v3.6.25 — الإصلاح النهائي لمحرك تدقيق ومقارنة قوائم التشغيل وتحميل المفقود
          tag_name: v3.6.25
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🚀 V-Downloader v3.6.25 — الإصلاح النهائي لمحرك تدقيق قوائم التشغيل وتحميل المفقود (Playlist Sync Engine Fix)

            > 💎 **تحديث فائق الدقة يعالج بالكامل محرك مقارنة المجلد بالقائمة (Smart Playlist Sync) ويقضي على خطأ مطابقة ملف واحد مع جميع المقاطع، ليصبح تدقيق وتنزيل العناصر المفقودة فائق الدقة والموثوقية بنسبة 100%.**

            ---

            ### 🌟 أبرز ما يقدمه الإصدار v3.6.25:

            * 🔍 **إصلاح جذري لمحرك مقارنة القوائم وتحميل المفقود (Smart Playlist Sync)**:
              - تطبيق نظام الحجز الحصري الفردي (1-to-1 File Claiming): لا يمكن لملف واحد على القرص أن يُطابق أكثر من عنصر واحد في القائمة إطلاقاً.
              - معالجة خطأ القوائم التي كانت تُظهر 177 / 177 رغم وجود 11 ملفاً فقط على القرص، وإظهار الإحصائيات الحقيقية الدقيقة فوراً (المحمّل الفعلي والمفقود بدقة).
              - منع فحص مجلد التنزيل العام الرئيسي واقتصار الفحص على المجلد المخصص للقائمة تجنباً للمطابقات الخاطئة.
            * 🎯 **فصل المقاطع الفردية عن قوائم التشغيل**: منع دمج المقاطع الفردية المستقلة في بطاقات قوائم وهمية.
            * 📱 **استقرار استخراج وتنزيل Instagram و Facebook**: حل مشاكل الروابط وإلغاء الارتداد لملفات قديمة عند تعثر الروابط.
            * 🛑 **إيقاف التطبيق والخدمة فوراً عند الخروج**: إنهاء فوري لخدمة الخلفية وإخفاء الإشعار تلقائياً.
            * 📑 **تنزيل ترجمات قوائم التشغيل كاملة**: دعم شامل لتنزيل ترجمات كافة مقاطع القائمة بلا استثناء.

            ---

            ### 📦 ملفات التثبيت المتاحة (Download Assets):
            * `V-Downloader-arm64-v8a-release.apk` — للأجهزة الحديثة بمعمارية 64-bit (موصى به لمعظم الهواتف).
            * `V-Downloader-armeabi-v7a-release.apk` — للأجهزة الأقدم بمعمارية 32-bit.
            * `V-Downloader-universal-release.apk` — نسخة شاملة متوافقة مع جميع الأجهزة والمعالجات.

            ---
            *صُنِع بكل شغف لتقديم أفضل وأقوى تجربة تنزيل وسائط للأندرويد.* ❤️